name: SHIFT demo dashboard

on:
  schedule:
    - cron: "0 9 * * *"      # once daily ~5am ET; demos only roll by date, every-5-min hit Cloudflare deploy limits
  workflow_dispatch: {}      # lets you trigger a run by hand too

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build dashboards
        env:
          GSHEETS_SA_JSON: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          ASOF=$(date -d "+6 days" +%Y-%m-%d)
          python -m nudge_tool run --client shift_demo --skip-status --as-of 2026-06-01
          python -m nudge_tool run --client shift_demo_live --skip-status --as-of "$ASOF"
          mkdir -p publish
          cp nudge_tool/clients/shift_demo/out/dashboard.html      publish/walkthrough.html
          cp nudge_tool/clients/shift_demo_live/out/dashboard.html publish/live.html
          cp publish_index.html publish/index.html
      - name: Ensure Pages project exists (first run only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create shift-demo-dash --production-branch main || true
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publish --project-name=shift-demo-dash --branch=main
