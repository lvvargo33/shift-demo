services:
  - type: web
    name: shift-live-dash
    runtime: python
    plan: standard           # ~$25/mo, 2 GB. Upgraded from starter 2026-07-28 after
                             # two OOM restarts (512 MB ceiling; activity cache grew
                             # with the outreach log). Luke approved same day.
    buildCommand: pip install -r requirements.txt
    startCommand: python live_server.py
    envVars:
      - key: GSHEETS_SA_JSON  # paste the service-account key JSON. Viewer on the
                              # Form sheet is enough for the dashboard; the in-app
                              # Send buttons also write the outreach log back to
                              # Drive, so the SA must be Editor on the Drive folder.
        sync: false
      - key: LIVE_USER        # login gate for the PII page
        sync: false
      - key: LIVE_PASS
        sync: false
      - key: LIVE_CLIENT       # 'shift' = real data via Drive; 'shift_demo_live' = fake demo
        value: shift
      - key: LIVE_REFRESH      # auto-reload the page every N seconds (0 = off; floored to 180s in code)
        value: "180"
      # Real Beta data: Drive file ids from `drive_sync.py push`. With these set,
      # the host pulls fresh CSVs on load (read-only). Leave unset to keep the
      # demo on fake data. The SAME GSHEETS_SA_JSON above must have Viewer/Editor
      # on the Drive folder.
      - key: BETA_DRIVE_TX
        sync: false
      - key: BETA_DRIVE_SES
        sync: false
      - key: BETA_DRIVE_MEM
        sync: false
      - key: BETA_DRIVE_TTL    # min seconds between Drive pulls (cache)
        value: "60"
      - key: OUTREACH_DRIVE_ID # Drive file id of outreach_log.csv -> powers the Recovery Queue "Export" of who was sent what
        sync: false
      # In-app manual Send buttons (per-person + "send all"). The web service tags
      # climbers in Mailchimp on click, exactly like the daily cron, then writes
      # the outreach log back to Drive. All four below are required for the buttons
      # to actually send; without them the buttons report "not switched on" and the
      # daily auto-send is unaffected.
      - key: NUDGE_LIVE_ENABLED  # the in-app send switch (same meaning as on the cron)
        value: "true"
      - key: MAILCHIMP_API_KEY   # the SEND account's creds (same as the nudge-send cron)
        sync: false
      - key: MAILCHIMP_SERVER
        sync: false
      - key: MAILCHIMP_AUDIENCE_ID
        sync: false
    healthCheckPath: /healthz

  # Daily auto-pull of Beta data (replaces the manual export). Runs on a fresh
  # container each time, so it: pulls the canonical CSVs from Drive -> merges a
  # rolling 2-day Beta window (dedup) -> pushes them back to Drive -> emails a
  # success/failure report. The web service above then serves the refreshed data.
  - type: cron
    name: shift-beta-pull
    runtime: python
    schedule: "0 7 * * *"      # 3 AM ET. 07:00 UTC = 3 AM EDT (summer). After DST
                               # ends (Nov), 3 AM EST = 08:00 UTC -> change to "0 8 * * *".
    buildCommand: pip install -r requirements.txt
    startCommand: python beta_pull.py --drive --notify
    envVars:
      - key: GSHEETS_SA_B64    # base64 of the SA key JSON (paste-safe); Editor on the Drive folder
        sync: false
      - key: BETA_API_KEY      # Firebase web API key (AIza...)
        sync: false
      - key: BETA_REFRESH_TOKEN  # long-lived Firebase refresh token (from browser, once)
        sync: false
      - key: BETA_DRIVE_TX     # Drive file ids (same as the web service uses)
        sync: false
      - key: BETA_DRIVE_SES
        sync: false
      - key: BETA_DRIVE_MEM
        sync: false
      - key: BETA_GYM_ID
        value: "13353"
      - key: BETA_TX_PATH      # working paths inside the (ephemeral) cron container
        value: beta_data/Transactions.csv
      - key: BETA_SES_PATH
        value: beta_data/Sessions.csv
      - key: BETA_MEM_PATH
        value: beta_data/Memberships.csv
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER         # the Gmail address that sends the report
        sync: false
      - key: SMTP_PASS         # Gmail APP PASSWORD (not the account password)
        sync: false
      - key: NOTIFY_TO         # where the daily report goes
        sync: false

  # Daily AUTO-SEND. Runs ~30 min after shift-beta-pull (so it tags off fresh
  # data): pulls the Beta CSVs + outreach log from Drive -> builds today's queue
  # -> tags each climber in Mailchimp (a Journey then sends) -> pushes the log
  # back -> emails a report. GATED OFF: with NUDGE_LIVE_ENABLED unset it computes
  # the queue and tags NOBODY (safe no-op). Set NUDGE_LIVE_ENABLED=true to go live
  # (only after SHIFT signoff + the welcome-on-subscribe automation is handled +
  # the Journey + approved copy). The bundle ships live_enabled:false, so this one
  # env var is the whole go-live switch, no rebuild.
  - type: cron
    name: shift-nudge-send
    runtime: python
    plan: standard           # 2 GB. Raised from the 512 MB default 2026-08-04 after
                             # this cron was OOM-killed mid-run (Render alert 15:04
                             # UTC; no report email, because the script buffers all
                             # output until the end). A cron is billed only for the
                             # seconds it runs, so a bigger instance for a ~5 min
                             # daily job costs cents, not the web plan's monthly fee.
                             # Watch the "peak=" number in the stderr stage markers:
                             # that is the real headroom. shift-beta-pull is left on
                             # the default; it finishes in ~30s and has never OOMed.
    schedule: "0 15 * * *"     # 11 AM ET (EDT). 15:00 UTC = 11 AM EDT. After DST ends -> "0 16 * * *". Time set to land ~4h before SHIFT's 3pm attendance rush (per Capacity heatmap).
    buildCommand: pip install -r requirements.txt
    startCommand: python send_nudges.py --drive --notify --yes --i-have-shift-signoff
    envVars:
      - key: NUDGE_LIVE_ENABLED  # THE go-live switch. unset/false = no-op (tags nobody).
        value: "true"   # LIVE as of 2026-06-19 (SHIFT signoff + Mailchimp creds in place). Forward-only floor still gates who is eligible.
      - key: NUDGE_CLIENT
        value: shift
      # SA key via Secret File (proven path; raw/base64 env-field pastes corrupt
      # on Render). In the dashboard add a Secret File named sa_key.json holding
      # the SAME base64 SA key content as shift-beta-pull; it mounts at the path
      # below. Editor on the Drive folder.
      - key: GSHEETS_SA_KEY
        value: /etc/secrets/sa_key.json
      - key: MAILCHIMP_API_KEY   # the SEND account's creds (this cron tags real climbers)
        sync: false
      - key: MAILCHIMP_SERVER
        sync: false
      - key: MAILCHIMP_AUDIENCE_ID
        sync: false
      - key: BETA_DRIVE_TX     # same Beta CSV ids as the web service
        sync: false
      - key: BETA_DRIVE_SES
        sync: false
      - key: BETA_DRIVE_MEM
        sync: false
      - key: OUTREACH_DRIVE_ID # canonical outreach_log.csv (pre-create + share with the SA)
        sync: false
      # Engagement cache (2026-08-04). Drive file id of a CSV holding the frozen
      # delivered/opened/clicked for sends older than the fresh window, so the
      # stats push stops re-asking Mailchimp about every person ever emailed
      # (that loop was 181s of a 204s run and grew ~5s a day). Same setup as
      # OUTREACH_DRIVE_ID: create an empty file by hand in the Drive folder,
      # share it with the SA as Editor, paste its id here.
      # UNSET = the old behaviour, every send measured live. Safe either way.
      - key: ENGAGEMENT_CACHE_DRIVE_ID
        sync: false
      - key: ENGAGEMENT_FRESH_DAYS  # days a send stays re-measured before it freezes
        value: "14"
      - key: BETA_TX_PATH      # working paths = the client's data paths in the bundle
        value: beta_data/Transactions.csv
      - key: BETA_SES_PATH
        value: beta_data/Sessions.csv
      - key: BETA_MEM_PATH
        value: beta_data/Memberships.csv
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_TO
        sync: false
