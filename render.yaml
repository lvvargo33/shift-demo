services:
  - type: web
    name: shift-live-dash
    runtime: python
    plan: starter            # ~$7/mo, always on (no cold starts). 'free' sleeps.
    buildCommand: pip install -r requirements.txt
    startCommand: python live_server.py
    envVars:
      - key: GSHEETS_SA_JSON  # paste the service-account key JSON (Viewer on the Form sheet)
        sync: false
      - key: LIVE_USER        # login gate for the PII page
        sync: false
      - key: LIVE_PASS
        sync: false
      - key: LIVE_CLIENT       # 'shift' = real data via Drive; 'shift_demo_live' = fake demo
        value: shift
      - key: LIVE_REFRESH      # auto-reload the page every N seconds (0 = off; floored to 180s in code)
        value: "180"
      # Real Beta data: Drive file ids from `drive_sync.py push`. With these set,
      # the host pulls fresh CSVs on load (read-only). Leave unset to keep the
      # demo on fake data. The SAME GSHEETS_SA_JSON above must have Viewer/Editor
      # on the Drive folder.
      - key: BETA_DRIVE_TX
        sync: false
      - key: BETA_DRIVE_SES
        sync: false
      - key: BETA_DRIVE_MEM
        sync: false
      - key: BETA_DRIVE_TTL    # min seconds between Drive pulls (cache)
        value: "60"
      - key: OUTREACH_DRIVE_ID # Drive file id of outreach_log.csv -> powers the Recovery Queue "Export" of who was sent what
        sync: false
    healthCheckPath: /healthz

  # Daily auto-pull of Beta data (replaces the manual export). Runs on a fresh
  # container each time, so it: pulls the canonical CSVs from Drive -> merges a
  # rolling 2-day Beta window (dedup) -> pushes them back to Drive -> emails a
  # success/failure report. The web service above then serves the refreshed data.
  - type: cron
    name: shift-beta-pull
    runtime: python
    schedule: "0 7 * * *"      # 3 AM ET. 07:00 UTC = 3 AM EDT (summer). After DST
                               # ends (Nov), 3 AM EST = 08:00 UTC -> change to "0 8 * * *".
    buildCommand: pip install -r requirements.txt
    startCommand: python beta_pull.py --drive --notify
    envVars:
      - key: GSHEETS_SA_B64    # base64 of the SA key JSON (paste-safe); Editor on the Drive folder
        sync: false
      - key: BETA_API_KEY      # Firebase web API key (AIza...)
        sync: false
      - key: BETA_REFRESH_TOKEN  # long-lived Firebase refresh token (from browser, once)
        sync: false
      - key: BETA_DRIVE_TX     # Drive file ids (same as the web service uses)
        sync: false
      - key: BETA_DRIVE_SES
        sync: false
      - key: BETA_DRIVE_MEM
        sync: false
      - key: BETA_GYM_ID
        value: "13353"
      - key: BETA_TX_PATH      # working paths inside the (ephemeral) cron container
        value: beta_data/Transactions.csv
      - key: BETA_SES_PATH
        value: beta_data/Sessions.csv
      - key: BETA_MEM_PATH
        value: beta_data/Memberships.csv
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER         # the Gmail address that sends the report
        sync: false
      - key: SMTP_PASS         # Gmail APP PASSWORD (not the account password)
        sync: false
      - key: NOTIFY_TO         # where the daily report goes
        sync: false

  # Daily AUTO-SEND. Runs ~30 min after shift-beta-pull (so it tags off fresh
  # data): pulls the Beta CSVs + outreach log from Drive -> builds today's queue
  # -> tags each climber in Mailchimp (a Journey then sends) -> pushes the log
  # back -> emails a report. GATED OFF: with NUDGE_LIVE_ENABLED unset it computes
  # the queue and tags NOBODY (safe no-op). Set NUDGE_LIVE_ENABLED=true to go live
  # (only after SHIFT signoff + the welcome-on-subscribe automation is handled +
  # the Journey + approved copy). The bundle ships live_enabled:false, so this one
  # env var is the whole go-live switch, no rebuild.
  - type: cron
    name: shift-nudge-send
    runtime: python
    schedule: "30 7 * * *"     # 3:30 AM ET (EDT). After DST ends -> "30 8 * * *".
    buildCommand: pip install -r requirements.txt
    startCommand: python send_nudges.py --drive --notify --yes --i-have-shift-signoff
    envVars:
      - key: NUDGE_LIVE_ENABLED  # THE go-live switch. unset/false = no-op (tags nobody).
        value: "false"
      - key: NUDGE_CLIENT
        value: shift
      # SA key via Secret File (proven path; raw/base64 env-field pastes corrupt
      # on Render). In the dashboard add a Secret File named sa_key.json holding
      # the SAME base64 SA key content as shift-beta-pull; it mounts at the path
      # below. Editor on the Drive folder.
      - key: GSHEETS_SA_KEY
        value: /etc/secrets/sa_key.json
      - key: MAILCHIMP_API_KEY   # the SEND account's creds (this cron tags real climbers)
        sync: false
      - key: MAILCHIMP_SERVER
        sync: false
      - key: MAILCHIMP_AUDIENCE_ID
        sync: false
      - key: BETA_DRIVE_TX     # same Beta CSV ids as the web service
        sync: false
      - key: BETA_DRIVE_SES
        sync: false
      - key: BETA_DRIVE_MEM
        sync: false
      - key: OUTREACH_DRIVE_ID # canonical outreach_log.csv (pre-create + share with the SA)
        sync: false
      - key: BETA_TX_PATH      # working paths = the client's data paths in the bundle
        value: beta_data/Transactions.csv
      - key: BETA_SES_PATH
        value: beta_data/Sessions.csv
      - key: BETA_MEM_PATH
        value: beta_data/Memberships.csv
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_TO
        sync: false
