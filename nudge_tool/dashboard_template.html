  if (!weak.length) inner = noData('No scored responses yet.');
  weak.forEach(w => {
    inner += '<div class="fu-label" style="margin:2px 0 8px;">' + escapeHtml(w.label) + ' · ' + w.avg.toFixed(1) + ' / 10</div>';
    const quotes = cur.filter(r => r.scores[w.key] != null && r.scores[w.key] <= 6 && (r.text.improve || r.text.why))
      .sort((a, b) => a.scores[w.key] - b.scores[w.key]).slice(0, 3);
    if (!quotes.length) inner += '<div style="font-size:12px;color:var(--fg-hint);margin-bottom:10px;">No comments from low scorers here.</div>';
    quotes.forEach(r => {
      inner += '<div class="mquote"><div class="mquote-text">“' + escapeHtml(r.text.improve || r.text.why) + '”</div>' +
        '<div class="mquote-meta"><span>' + escapeHtml(r.name) + '</span><span>scored it ' + r.scores[w.key] + '/10</span></div></div>';
    });
  });
  slides.push({ title: 'What members say about the weak spots', desc: 'Open comments from members who scored the two weakest dimensions 6 or below. Real responses, grouped under the low averages they explain (matched by score, not by topic).', html: inner });

  // 7. recent wins (from the old Overview page; Block 20 R2 decision 14)
  const wins = cur.filter(r => r.scores.nps != null && r.scores.nps >= 8 && (r.text.why || r.text.shout_out)).slice(0, 4);
  inner = wins.length
    ? wins.map(r => '<div class="mquote"><div class="mquote-text">“' + escapeHtml(r.text.why || r.text.shout_out) + '”</div>' +
        '<div class="mquote-meta"><span>' + escapeHtml(r.name) + '</span><span>' + escapeHtml(r.answered_at) + '</span>' + mScoreBadge(r.scores.nps) + '</div></div>').join('')
    : noData('No comments yet from members who scored recommend 8 or more.');
  slides.push({ title: 'Recent wins', desc: 'What members who scored recommend 8 or more are saying, newest first.', html: inner });

  // 8. member count (Chris 2026-09-02): the old Overview card, kept as the
  // last chart so the weekly trend line is not lost (Home shows the number)
  const mcc = mMemberCountCard();
  if (mcc) slides.push({ title: 'Member count', desc: 'How many members you have, and which way it is moving. One point is recorded each week.', html: mcc });

  return slides;
}
function renderMembersInsights() {
  let h = pageHeader('Member Insights', 'The whole picture from the membership survey. Wave ' + M_CUR + ' is the current one.');
  h += mStatusBanners();
  h += mDisclosure();
  const slides = buildMemberSlides();
  if (MINSIGHTS_SLIDE >= slides.length) MINSIGHTS_SLIDE = 0;
  const cur = slides[MINSIGHTS_SLIDE] || { title: '', desc: '', html: '' };
  h += '<div class="carousel">' +
    '<div class="carousel-head"><div class="card-title">' + icon('sparkles') + escapeHtml(cur.title) + '</div>' +
      '<div class="card-description">' + escapeHtml(cur.desc) + '</div></div>' +
    '<div class="carousel-body">' + cur.html + '</div>' +
    '<div class="carousel-nav">' +
      '<button class="carousel-arrow" onclick="mInsightsGoto(' + (MINSIGHTS_SLIDE - 1) + ',' + slides.length + ')" aria-label="Previous chart">‹</button>' +
      '<div class="carousel-dots">' +
        slides.map((s, i) => '<span class="cdot' + (i === MINSIGHTS_SLIDE ? ' active' : '') + '" title="' + escapeHtml(s.title) + '" onclick="mInsightsGoto(' + i + ',' + slides.length + ')"></span>').join('') +
      '</div>' +
      '<button class="carousel-arrow" onclick="mInsightsGoto(' + (MINSIGHTS_SLIDE + 1) + ',' + slides.length + ')" aria-label="Next chart">›</button>' +
    '</div>' +
    '<div class="carousel-counter">' + (MINSIGHTS_SLIDE + 1) + ' of ' + slides.length + '</div>' +
  '</div>';
  $('view-m-insights').innerHTML = h;
}

/* --- Survey Settings (READ-ONLY in v1, decision 2026-08-21) --- */
function mCfgNote(txt) { return '<div style="font-size:11px;color:var(--fg-hint);margin:6px 0 2px;">' + escapeHtml(txt) + '</div>'; }
function renderMemberSettings() {
  const c = MDATA.config || {}, a = MDATA.audience, s = MDATA.sent || {};
  let h = pageHeader('Member Survey Settings',
    'How the membership survey runs. Read-only here: every value below comes from the live configuration, and changes go through your Send It contact (client.json).');
  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('shield') + 'Status</div></div>' +
    '<div class="card-content with-top">' +
    cfgRow('Sending', c.enabled ? 'ON. Up to ' + c.daily_cap + ' members get the survey each morning.' : 'OFF (member_survey.enabled is false). Nothing goes to members until it is switched on.') +
    cfgRow('Sent so far', (s.total || 0) + ' survey' + (s.total === 1 ? '' : 's') + (s.last_send_date ? ', last on ' + s.last_send_date : '') + (s.today ? ', ' + s.today + ' today' : '')) +
    cfgRow('Responses in the sheet', (MDATA.responses_total_rows || 0) + ' rows, ' + mAllResponses().length + ' matched to members' +
      (MDATA.responses_unmatched ? ', ' + MDATA.responses_unmatched + ' test/unmatched' : '') + (MDATA.duplicates_dropped ? ', ' + MDATA.duplicates_dropped + ' duplicate' + (MDATA.duplicates_dropped === 1 ? '' : 's') + ' (latest per member kept)' : '')) +
    mCfgNote('Change in client.json: member_survey.enabled') +
    '</div></div>';

  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('settings') + 'Cadence & delivery</div></div>' +
    '<div class="card-content with-top">' +
    cfgRow('Who gets it', 'Active members (status OK) with a usable email. Members flagged do-not-mail are never sent to and are excluded from every number in this section.') +
    cfgRow('How many per day', c.daily_cap + ' (so a first wave of ' + (a ? a.sendable : '?') + ' takes about ' + (a && c.daily_cap ? Math.ceil(a.sendable / c.daily_cap) : '?') + ' days)') +
    cfgRow('How often', 'Every ' + c.cooldown_days + ' days per member. One send per wave, no reminders.') +
    cfgRow('Shared inboxes', 'One survey per email address (families share), answered by whoever opens it.') +
    cfgRow('The survey', c.survey_url ? 'SurveyMonkey, 8 questions, about 3 minutes. ' + c.survey_url : 'not configured') +
    mCfgNote('Change in client.json: member_survey.daily_cap, cooldown_days, survey_url') +
    '</div></div>';

  if (a) {
    h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('users') + 'Audience</div>' +
      '<div class="card-description">' + escapeHtml(a.disclosure_sentence) + '</div></div>' +
      '<div class="card-content with-top">' +
      cfgRow('Member records', a.member_rows + ' (' + Object.entries(a.inactive_by_status || {}).map(kv => kv[1] + ' ' + kv[0].toLowerCase()).join(', ') + ')') +
      cfgRow('Active members', String(a.active)) +
      cfgRow('Minus no usable email', '-' + a.no_email) +
      cfgRow('Minus do not mail', '-' + a.do_not_mail_step + ' (' + a.excluded_do_not_mail + ' flagged in total, counting those with no email)') +
      cfgRow('Minus shared addresses', '-' + a.shared_dropped) +
      cfgRow('Sendable', String(a.sendable)) +
      '</div></div>';
  }

  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('mail') + 'Sender identity</div></div>' +
    '<div class="card-content with-top">' +
    cfgRow('From', c.from_email ? (c.from_name ? c.from_name + ' <' + c.from_email + '>' : c.from_email) : 'not set on this server (the send service has its own setting)') +
    cfgRow('Reply-To', c.reply_to || (c.from_email ? 'same as From' : 'not set on this server')) +
    cfgRow('Signed', '“' + (c.manager_name || 'The team') + '” on every reply template' + (c.gym_name ? ', gym name “' + c.gym_name + '”' : '')) +
    mCfgNote('Change on the server: BREVO_SEND_FROM / BREVO_REPLY_TO; in client.json: links.manager_name, links.gym_name') +
    '</div></div>';

  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('sparkles') + 'How a reply gets picked</div>' +
    '<div class="card-description">A fixed rule. Nothing here is guessed.</div></div>' +
    '<div class="card-content with-top">' +
    cfgRow('Thank-you', 'Only when EVERY one of the six scored questions (likelihood to remain, staff, community, route setting, cleanliness, value) is ' + c.positive_threshold + ' or higher. It asks for a Google review.') +
    cfgRow('Otherwise', 'The lowest-scored question picks its follow-up template. Ties go to likelihood-to-remain first, then staff, community, route setting, cleanliness, value.') +
    cfgRow('Recommend score', 'Shown as urgency (Likelihood to Recommend) but never picks the template.') +
    cfgRow('Automatic thank-you', c.auto_reply
      ? 'ON. The thank-you goes out by itself the next morning after an all-' + c.positive_threshold + '+ response (once per response, only within ' + (c.auto_reply_max_age_days || 14) + ' days of the answer' + (c.enabled ? '' : ', and only once surveys are switched on') + '). Every other reply is sent by a person from the response page.'
      : 'OFF. Every reply, including the thank-you, is sent by a person from the response page.') +
    cfgRow('Replies from this page', (mSendEnabled() ? 'ON. ' : 'Not yet on this server (needs the live flag + Brevo key on the web service). ') + 'Pick a template on the response page, change the words if you like, and Send; it goes out signed “' + (c.manager_name || 'The team') + '” and is logged for the whole team.') +
    cfgRow('Reply edits saved', (function () {
      const re = MDATA.reply_edits || {};
      const n = re.rows || 0, ch = re.changed || 0;
      if (MDATA.reply_edits_csv_ok === false) return 'The edit record could not be read on this server.';
      return n + ' repl' + (n === 1 ? 'y' : 'ies') + ' sent from this page, ' + ch + ' with changed wording. Each one keeps the template text next to what was actually sent (member_reply_edits.csv in the gym’s private Drive folder).';
    })()) +
    mCfgNote('Change in client.json: member_survey.positive_threshold, member_survey.auto_reply') +
    '</div></div>';

  // The "Follow-up rules" card left with the follow-up panel (Block 24 decision 8).

  // Live front-desk check-in alert (2026-08-21). Config from c.checkin_alert,
  // runtime status from MDATA.checkin_alert (live_server; absent on a static build).
  const ca = MDATA.checkin_alert || {};
  const cac = c.checkin_alert || {};
  const caInbox = ca.inbox || cac.inbox || 'not configured';
  const caReasons = ca.reasons || (cac.enabled ? ['status not available on this build'] : ['member_survey.checkin_alert.enabled is false']);
  const caOn = ca.running === true || (ca.running === undefined && cac.enabled && !caReasons.length);
  let caState;
  if (caOn) {
    caState = 'ON. When a member with an open follow-up checks in, an email goes to ' + caInbox + ' (at most once per member per day).';
  } else {
    caState = 'OFF: ' + caReasons.join('; ') + '. Nothing is emailed until that is fixed.';
  }
  let caLast;
  if (ca.last_poll_at) {
    caLast = 'Last checked ' + ca.last_poll_at.replace('T', ' ').slice(0, 16) +
      (ca.feed_lag_minutes === null || ca.feed_lag_minutes === undefined ? ' (no check-ins in the last ' + (ca.max_age_minutes || cac.max_age_minutes || 90) + ' minutes)' : ', check-in feed about ' + ca.feed_lag_minutes + ' min behind') +
      (ca.feed_stale ? '. The feed is behind, so alerts may be late or missed.' : '') +
      (ca.last_error ? ' Last error: ' + ca.last_error : '');
  } else {
    caLast = ca.last_error ? 'Not checked yet. Last error: ' + ca.last_error : 'Not checked yet on this server.';
  }
  // Switched off on purpose (Block 24 decision 8, Chris's 10/16 call): say so
  // plainly instead of listing config reasons and a workflow that left the page.
  if (!cac.enabled) {
    h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('shield') + 'Front-desk alert</div></div>' +
      '<div class="card-content with-top">' +
      cfgRow('Check-in alert', 'OFF. Switched off on purpose in October 2026, together with the follow-up panel. No check-in emails go to the front desk.') +
      mCfgNote('Change in client.json: member_survey.checkin_alert.enabled') +
      '</div></div>';
    $('view-m-settings').innerHTML = h;
    return;
  }
  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('shield') + 'Front-desk alert</div>' +
    '<div class="card-description">A live heads-up while the member is in the building.</div></div>' +
    '<div class="card-content with-top">' +
    cfgRow('Check-in alert', caState) +
    cfgRow('Who triggers it', 'Only members whose follow-up is still open (not resolved). Promoters never do. Once the desk marks the follow-up resolved, the alerts stop.') +
    cfgRow('How it works', 'The dashboard checks the gym’s check-in feed every ' + (ca.poll_minutes || cac.poll_minutes || 10) + ' minutes and only looks at check-ins from the last ' + (ca.max_age_minutes || cac.max_age_minutes || 90) + ' minutes, so a delayed feed never sends a pile of stale alerts.') +
    cfgRow('Status', caLast + (ca.alerted_today ? ' ' + ca.alerted_today + ' alert' + (ca.alerted_today === 1 ? '' : 's') + ' sent today.' : '')) +
    cfgRow('Morning digest', 'Not used. The follow-up list on this page replaces it (decided 2026-08-21).') +
    mCfgNote('Change in client.json: member_survey.checkin_alert (enabled, inbox, poll_minutes, max_age_minutes); on the web server: RGP_API_KEY, NUDGE_LIVE_ENABLED, BREVO_API_KEY') +
    '</div></div>';
  $('view-m-settings').innerHTML = h;
}

/* --- wire-up --- */
function setupMembersNav() {
  const wrap = $('members-nav');
  if (!wrap) return;
  if (!membersOn()) { wrap.classList.remove('on'); return; }
  wrap.classList.add('on');
  renderMemberResponses();
  renderRecognition();
  renderMembersInsights();
  renderMemberSettings();
  mRefreshMembersBadge();
}
if (membersOn()) {
  const _mBaseShowView = showView;
  showView = function (viewId) {
    _mBaseShowView(viewId);
    if (viewId === 'm-respdetail') {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const btn = document.querySelector('.nav-btn[data-view="m-responses"]');
      if (btn) btn.classList.add('active');
    }
  };
}

// init
REPORT_PERIOD = reportingOn() ? defaultPeriod() : 'all';
restoreInsightsState();   // re-apply period / counts-% / chart after an auto-refresh reload
$('brand-sub').textContent = DATA.client || 'Send It';
renderHome();
renderActivity();
setupSurveyNav();
if (typeof setupMembersNav === 'function') setupMembersNav();   // ABC's Members pages (absent at SHIFT)

// Restore the tab across auto-refresh reloads (so a periodic refresh doesn't
// snap the reader back to Home). The old page names (a bookmark, a stored
// tab from before Block 20 R2) map onto the pages that replaced them.
(function restoreView() {
  let id = '';
  try { id = sessionStorage.getItem('shiftActiveView') || ''; } catch (e) {}
  if (!id) id = (location.hash || '').replace('#', '');
  id = ({ dashboard: 'home', queue: 'activity', inbox: 'surveys', 'm-overview': 'home' })[id] || id;
  const hasMembers = typeof membersOn === 'function' && membersOn();
  const mvalid = ['m-responses', 'm-recognition', 'm-insights', 'm-settings'];   // m-settings: no sidebar entry, hash only (decision 7b)
  if (mvalid.includes(id)) { if (hasMembers) showView(id); return; }
  if (id === 'm-respdetail') { if (hasMembers) showView('m-responses'); return; }
  const valid = ['home', 'activity', 'surveys', 'insights'];
  if (!valid.includes(id) || id === 'home') return;
  if (id === 'surveys' && !surveyOn()) return;
  showView(id);
})();
</script>
