<!DOCTYPE html>
<!--
  shift-nudge-tool dashboard. Reuses the "Send It" Lovable skin (CSS verbatim
  from Redesign/Shift_ABC_Prep/New_HTML/ftv_mvp_demo_v2_shift.html). Views built
  on REAL Beta-export data (FTV_PILOT_SPEC.md section 14). Since Block 20 R2
  (2026-10-08): Home (what needs you, what runs by itself, how it is going),
  Email activity (a log of the automatic emails, opened from Home, nothing to
  send), Insights, and one survey page (new answers on top). The Dashboard and
  the Recovery Queue pages are gone.

  The tool injects the run's data into the <script id="nudge-data"> tag below
  (replacing the DATA JSON placeholder in the nudge-data script tag; the
  placeholder token must appear ONLY there, or the replace injects the data
  twice and doubles the page, which it did until 2026-10-08), so this is a
  single self-contained file: no server,
  no fetch. It is a VIEW of who would be tagged; it never sends anything.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send It</title>
<style>
:root {
  --bg:               #F7F7F8;
  --bg-subtle:        #FAFAFB;
  --card:             #FFFFFF;
  --border:           #E5E5E8;
  --border-strong:    #D4D4D8;
  --border-soft:      #EFEFF1;
  --fg:               #111114;
  --fg-muted:         #4B4B53;
  --fg-subtle:        #71717A;
  --fg-hint:          #A1A1AA;
  --primary:          #BE4528;
  --primary-hover:    #A53D22;
  --primary-fg:       #FFFFFF;
  --primary-soft:     #FBE6DC;
  --primary-soft-2:   #F4CFBE;
  --primary-tint:     #FFF6F1;
  --red-tile-bg:      #FEF1EC;
  --red-tile-border:  #F4C2AE;
  --success:          #16A34A;
  --success-soft:     #DCFCE7;
  --success-fg:       #14532D;
  --success-tint:     #F0FDF4;
  --warning:          #D97706;
  --warning-soft:     #FED7AA;
  --warning-fg:       #7C2D12;
  --warning-tint:     #FFF7ED;
  --destructive:      #DC2626;
  --destructive-soft: #FEE2E2;
  --destructive-fg:   #7F1D1D;
  --destructive-tint: #FEF2F2;
  --info:             #2563EB;
  --info-soft:        #DBEAFE;
  --info-fg:          #1E3A8A;
  --radius-sm:        6px;
  --radius:           10px;
  --radius-lg:        14px;
  --shadow-xs: 0 1px 2px 0 rgba(15,15,20,0.04);
  --shadow-sm: 0 1px 3px 0 rgba(15,15,20,0.05), 0 1px 2px -1px rgba(15,15,20,0.04);
  --shadow-card: 0 1px 2px 0 rgba(15,15,20,0.04);
  --t-fast: 120ms cubic-bezier(0.16, 1, 0.3, 1);
  --t-norm: 180ms cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, textarea, select { font-family: inherit; }

.sidebar { position: fixed; inset: 0 auto 0 0; width: 248px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1000; }
.sidebar-header { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 18px; border-bottom: 1px solid var(--border-soft); }
.sidebar-logo { width: 30px; height: 30px; border-radius: 7px; background: linear-gradient(135deg, var(--primary) 0%, #A53D22 100%); color: var(--primary-fg); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; letter-spacing: -0.5px; box-shadow: 0 1px 2px rgba(190,69,40,0.25); }
.sidebar-brand-name { font-size: 14px; font-weight: 600; letter-spacing: -0.2px; color: var(--fg); line-height: 1.2; }
.sidebar-brand-sub { font-size: 11px; color: var(--fg-subtle); line-height: 1.3; margin-top: 1px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 1px; padding: 10px; flex: 1; overflow-y: auto; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; background: transparent; border-radius: 7px; cursor: pointer; color: var(--fg-muted); font-size: 13px; font-weight: 500; text-align: left; transition: background var(--t-fast), color var(--t-fast); }
.nav-btn:hover { background: var(--bg-subtle); color: var(--fg); }
.nav-btn.active { background: var(--primary); color: var(--primary-fg); box-shadow: 0 1px 2px rgba(190,69,40,0.20); }
.nav-btn.active:hover { background: var(--primary-hover); }
.nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-badge { margin-left: auto; background: var(--primary-soft); color: var(--primary); font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 8px; }
.nav-btn.active .nav-badge { background: rgba(255,255,255,0.22); color: #fff; }
.nav-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--fg-hint); font-weight: 700; padding: 14px 10px 4px; }
.sidebar-footer { border-top: 1px solid var(--border-soft); padding: 12px 14px; }
.user-chip { font-size: 11px; color: var(--fg-subtle); margin-bottom: 6px; word-break: break-all; }

.main { margin-left: 248px; min-height: 100vh; }
.main-inner { max-width: 1140px; margin: 0 auto; padding: 32px 36px 60px; }
.view { display: none; }
.view.active { display: block; }

.page-header { margin-bottom: 26px; }
.page-title { font-size: 28px; font-weight: 700; letter-spacing: -0.6px; color: var(--fg); line-height: 1.2; }
.page-subtitle { margin-top: 8px; font-size: 14px; color: var(--fg-muted); max-width: 720px; line-height: 1.55; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-card); overflow: hidden; }
.card + .card { margin-top: 14px; }
.card-header { padding: 18px 20px 12px; }
.card-title { font-size: 15.5px; font-weight: 600; letter-spacing: -0.2px; color: var(--fg); display: flex; align-items: center; gap: 8px; }
.card-title svg { width: 14px; height: 14px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.card-description { margin-top: 4px; font-size: 12.5px; color: var(--fg-subtle); line-height: 1.5; }
.card-content { padding: 0 20px 20px; }
.card-content.with-top { padding-top: 16px; }
.card.card-highlight { background: linear-gradient(135deg, var(--primary-tint) 0%, var(--card) 60%); border-color: var(--primary-soft-2); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast); white-space: nowrap; }
.btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); box-shadow: 0 1px 2px rgba(190,69,40,0.2); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-outline { background: var(--card); color: var(--fg); border-color: var(--border-strong); }
.btn-outline:hover { background: var(--bg-subtle); border-color: var(--fg-hint); }
.btn-ghost { background: transparent; color: var(--fg-muted); }
.btn-ghost:hover { background: var(--bg-subtle); color: var(--fg); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--bg-subtle); color: var(--fg-muted); border: 1px solid var(--border); white-space: nowrap; }
.badge-primary    { background: var(--primary-soft);     color: var(--primary);      border-color: var(--primary-soft-2); }
.badge-success    { background: var(--success-soft);     color: var(--success-fg);   border-color: #BBF7D0; }
.badge-warning    { background: var(--warning-soft);     color: var(--warning-fg);   border-color: #FDBA74; }
.badge-destructive{ background: var(--destructive-soft); color: var(--destructive-fg); border-color: #FECACA; }
.badge-info       { background: var(--info-soft);        color: var(--info-fg);      border-color: #BFDBFE; }

.stats-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0 22px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px 14px; box-shadow: var(--shadow-card); transition: border-color var(--t-fast); }
.stat:hover { border-color: var(--border-strong); }
.stat.stat-red { border-color: var(--red-tile-border); background: var(--red-tile-bg); }
.stat-label { font-size: 12px; font-weight: 500; color: var(--fg-subtle); }
.stat.stat-red .stat-label { color: var(--destructive-fg); }
.stat-value { margin-top: 8px; font-size: 27px; font-weight: 700; letter-spacing: -0.8px; color: var(--fg); line-height: 1.05; }
.stat.stat-red .stat-value { color: var(--destructive); }
.stat-sub { margin-top: 4px; font-size: 11.5px; color: var(--fg-hint); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--card); color: var(--fg-muted); font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast); }
.chip:hover { background: var(--bg-subtle); color: var(--fg); }
.chip.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); box-shadow: 0 1px 2px rgba(190,69,40,0.18); }

.queue-card { margin-bottom: 8px; background: #FEF1EC; border-color: #F4C2AE; }
.queue-card .card-header { display: block; padding: 12px 16px 4px; }
.queue-card .card-content { padding: 0 16px 12px; }
.queue-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.queue-name { font-size: 14.5px; font-weight: 600; color: var(--fg); letter-spacing: -0.15px; cursor: pointer; }
.queue-name:hover { color: var(--primary); text-decoration: underline; }
.queue-email { font-size: 11px; color: var(--fg-subtle); margin-top: 1px; }
.queue-fields { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; font-size: 12.5px; margin: 6px 0 2px; }
@media (min-width: 768px) { .queue-fields { grid-template-columns: repeat(4, 1fr); } }
.field-cell .field-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--fg-subtle); font-weight: 600; }
.field-cell .field-value { margin-top: 1px; font-weight: 500; color: var(--fg); font-size: 12.5px; }
.queue-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-soft); }
.queue-expand-btn { background: transparent; border: none; cursor: pointer; padding: 4px 0 2px; font-size: 12px; color: var(--primary); font-weight: 500; }
.queue-expand-btn:hover { text-decoration: underline; }
.queue-survey-panel { display: none; padding: 12px 14px; background: rgba(255,255,255,0.6); border: 1px solid var(--border-soft); border-radius: 7px; margin-top: 6px; }
.queue-survey-panel.open { display: block; }
.inline-badges { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.email-subject { font-weight: 600; color: var(--fg); margin-bottom: 6px; font-size: 13px; }
.email-body { color: var(--fg-muted); white-space: pre-wrap; font-size: 12.5px; line-height: 1.55; }
.email-body a { color: var(--primary); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--primary-soft-2); }
.email-body a:hover { border-bottom-color: var(--primary); }

.banner { border-radius: var(--radius); padding: 12px 16px; margin-bottom: 20px; font-size: 13px; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
.banner svg { width: 17px; height: 17px; flex-shrink: 0; margin-top: 1px; stroke: currentColor; fill: none; stroke-width: 2; }
.banner-safe { background: var(--success-tint); border: 1px solid #BBF7D0; color: var(--success-fg); }
.banner-warn { background: var(--warning-tint); border: 1px solid #FDBA74; color: var(--warning-fg); }

.empty-state { text-align: center; padding: 38px 22px; color: var(--fg-subtle); }
.empty-state-icon { width: 42px; height: 42px; margin: 0 auto 12px; border-radius: 50%; background: var(--bg-subtle); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--fg-hint); font-size: 22px; }
.empty-state-title { font-size: 14.5px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
.empty-state-msg { font-size: 12.5px; max-width: 360px; margin: 0 auto; line-height: 1.55; }

/* --- behavior-priorities mini cards (Dashboard hero) --- */
.prio-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); padding-top: 8px; padding-bottom: 14px; }
.prio-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; box-shadow: var(--shadow-xs); }
.prio-count { font-size: 10.5px; color: var(--fg-subtle); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
.prio-count strong { color: var(--primary); font-size: 13px; }
.prio-title { font-size: 14.5px; font-weight: 600; margin-top: 4px; letter-spacing: -0.2px; }
.prio-desc { font-size: 12px; color: var(--fg-muted); margin-top: 4px; line-height: 1.45; }

/* --- detail --- */
.detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; font-size: 13px; }
@media (min-width: 768px) { .detail-grid { grid-template-columns: repeat(3, 1fr); } }
.visit-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.visit-chip { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--bg-subtle); border: 1px solid var(--border); color: var(--fg-muted); font-weight: 500; }

/* --- settings / config --- */
.cfg-row { display: grid; grid-template-columns: 168px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border-soft); font-size: 12.5px; }
.cfg-row:last-child { border-bottom: none; }
.cfg-key { color: var(--fg-subtle); font-weight: 600; }
.cfg-val { color: var(--fg); }
.cfg-trigger { padding: 11px 0; border-bottom: 1px solid var(--border-soft); }
.cfg-trigger:last-child { border-bottom: none; }
.cfg-trigger-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cfg-trigger-name { font-weight: 600; font-size: 13px; }
.cfg-trigger-meta { font-size: 11.5px; color: var(--fg-subtle); margin-top: 4px; line-height: 1.5; }
.cfg-trigger.cfg-waiting { opacity: 0.7; }

.hamburger { display: none; position: fixed; top: 12px; left: 12px; z-index: 1500; background: var(--card); border: 1px solid var(--border-strong); border-radius: 8px; width: 40px; height: 40px; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-sm); }
.hamburger svg { width: 20px; height: 20px; stroke: var(--fg); fill: none; stroke-width: 2; }
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(17,17,20,0.4); z-index: 999; }
.sidebar-backdrop.open { display: block; }

@media (max-width: 880px) {
  .hamburger { display: flex; }
  .sidebar { transform: translateX(-100%); transition: transform var(--t-norm); }
  .sidebar.open { transform: translateX(0); box-shadow: 6px 0 20px rgba(0,0,0,0.18); }
  .main { margin-left: 0; }
  .main-inner { padding: 60px 16px 40px; }
  .page-title { font-size: 22px; }
  .stats-grid-3 { grid-template-columns: 1fr 1fr; }
  .stat { padding: 12px 14px 10px; }
  .stat-value { font-size: 22px; }
  .queue-card .card-header { padding: 10px 14px 4px; }
  .queue-card .card-content { padding: 0 14px 10px; }
  .queue-actions .btn { padding: 6px 8px; font-size: 11.5px; }
  .cfg-row { grid-template-columns: 1fr; gap: 2px; }
}
@media (max-width: 500px) { .stats-grid-3 { grid-template-columns: 1fr; } }
.toast-host { position: fixed; bottom: 18px; right: 18px; z-index: 3000; pointer-events: none; }
.toast { background: var(--fg); color: #fff; border-radius: 8px; padding: 10px 14px; font-size: 13px; box-shadow: 0 8px 24px rgba(15,15,20,0.18); }

/* --- survey status line on queue cards --- */
.queue-survey-status { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin: 6px 0 2px; font-size: 12px; }
.queue-survey-status .ss-label { color: var(--fg-subtle); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.queue-survey-status .ss-await { color: var(--fg-hint); font-style: italic; }

/* --- withheld (suppression) card --- */
.withheld-card > summary { cursor: pointer; list-style: none; }
.withheld-card > summary::-webkit-details-marker { display: none; }
.withheld-card[open] > summary { border-bottom: 1px solid var(--border-soft); }
.withheld-hint { font-size: 11px; font-weight: 600; color: var(--fg-hint); margin-left: 8px; }
.withheld-card:not([open]) .withheld-hint::after { content: '▸ show'; }
.withheld-card[open] .withheld-hint::after { content: '▾ hide'; }
.withheld-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 0; border-bottom: 1px solid var(--border-soft); font-size: 12.5px; }
.withheld-row:last-child { border-bottom: none; }
.withheld-name { font-weight: 600; }
.withheld-email { color: var(--fg-subtle); font-size: 11px; }

/* --- inbox (survey responses, two-pane) --- */
.inbox-layout { display: grid; grid-template-columns: 310px 1fr; gap: 14px; align-items: start; }
@media (max-width: 880px) { .inbox-layout { grid-template-columns: 1fr; } }
.inbox-list { display: flex; flex-direction: column; gap: 6px; max-height: 72vh; overflow-y: auto; padding-right: 2px; }
.inbox-item { text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: border-color var(--t-fast), background var(--t-fast); }
.inbox-item:hover { border-color: var(--border-strong); background: var(--bg-subtle); }
.inbox-item.active { border-color: var(--primary); background: var(--primary-tint); }
.inbox-item-name { font-weight: 600; font-size: 13px; color: var(--fg); }
.inbox-item-meta { font-size: 11px; color: var(--fg-subtle); margin-top: 3px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.inbox-q { margin-bottom: 13px; }
.inbox-q .q-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--fg-subtle); font-weight: 600; }
.inbox-q .q-ans { font-size: 14px; color: var(--fg); margin-top: 2px; white-space: pre-wrap; line-height: 1.5; }
.inbox-q .q-ans.muted { color: var(--fg-hint); font-style: italic; }

/* --- insights bars --- */
.bar-row { margin-bottom: 11px; }
.bar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12.5px; margin-bottom: 4px; }
.bar-label { font-weight: 600; color: var(--fg); }
.bar-count { color: var(--fg-muted); font-weight: 600; white-space: nowrap; }
.bar-track { height: 22px; background: var(--bg-subtle); border: 1px solid var(--border-soft); border-radius: 6px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary) 0%, #A53D22 100%); transition: width var(--t-norm); }
.bar-fill.bar-green { background: linear-gradient(90deg, #16A34A 0%, #15803D 100%); }
.bar-sub { font-size: 11px; color: var(--fg-hint); margin-top: 2px; }
/* a second block on an email slide (the day-14 member check-in under Survey emails) */
.er-sub { margin: 18px 0 2px; padding-top: 14px; border-top: 1px solid var(--border-soft); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--fg-subtle); font-weight: 700; }
.er-sub-note { font-size: 11.5px; color: var(--fg-hint); margin-bottom: 10px; }

/* --- period toggle --- */
.period-toggle { display: flex; align-items: center; gap: 8px; margin: 0 0 18px; flex-wrap: wrap; }
.period-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--fg-subtle); font-weight: 700; }
.period-select { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--card); color: var(--fg); font-size: 13px; font-weight: 600; cursor: pointer; }
.period-select:hover { border-color: var(--fg-hint); }
.period-note { font-size: 11.5px; color: var(--warning-fg); background: var(--warning-tint); border: 1px solid #FDBA74; border-radius: 7px; padding: 4px 10px; }

/* --- insights: 2-up chart grid + conversion table --- */
.chart-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
@media (max-width: 880px) { .chart-grid-2 { grid-template-columns: 1fr; } }
.conv-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.conv-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--fg-subtle); font-weight: 700; padding: 4px 6px; border-bottom: 1px solid var(--border); }
.conv-table td { padding: 6px 6px; border-bottom: 1px solid var(--border-soft); }
.conv-table th.num, .conv-table td.num { text-align: center; font-variant-numeric: tabular-nums; }
.conv-table tr:last-child td { border-bottom: none; }

/* --- insights: trend line chart --- */
.chart-svg { display: block; width: 100%; height: auto; max-height: 230px; overflow: visible; margin-top: 4px; }
.chart-grid { stroke: var(--border-soft); stroke-width: 1; }
.chart-axis { stroke: var(--border-strong); stroke-width: 1; }
.chart-tick { font-size: 10.5px; fill: var(--fg-subtle); font-family: inherit; }
.chart-area-you { fill: var(--primary); fill-opacity: 0.07; }
.chart-line-you { stroke: var(--primary); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart-line-mem { stroke: var(--success); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart-dot-you { fill: var(--primary); stroke: var(--card); stroke-width: 1.5; }
.chart-dot-mem { fill: var(--success); stroke: var(--card); stroke-width: 1.5; }
.chart-legend { display: flex; gap: 18px; margin-top: 12px; font-size: 11.5px; color: var(--fg-subtle); }
.legend-swatch-line, .legend-swatch-mem { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend-swatch-line { background: var(--primary); }
.legend-swatch-mem { background: var(--success); }

/* --- insights: controls + counts/% toggle --- */
.insights-controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.insights-controls .period-toggle { margin: 0; }
.metric-toggle { display: inline-flex; align-items: center; gap: 8px; }
.metric-toggle .mt-btn { padding: 6px 13px; font-size: 12.5px; font-weight: 600; background: var(--card); color: var(--fg-muted); border: 1px solid var(--border-strong); cursor: pointer; }
.metric-toggle .mt-btn:first-of-type { border-radius: 8px 0 0 8px; }
.metric-toggle .mt-btn:last-of-type { border-radius: 0 8px 8px 0; border-left: none; }
.metric-toggle .mt-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* --- insights: single-chart carousel --- */
.carousel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 18px 20px 12px; }
.carousel-head { margin-bottom: 14px; min-height: 50px; }
.carousel-head .card-title { font-size: 15.5px; }
.carousel-body { min-height: 210px; }
.carousel-body .bar-row { margin-bottom: 7px; }
.carousel-body .bar-track { height: 18px; }
.carousel-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
.carousel-arrow { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--card); color: var(--fg); font-size: 19px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background var(--t-fast), border-color var(--t-fast); }
.carousel-arrow:hover { background: var(--bg-subtle); border-color: var(--fg-hint); }
.carousel-dots { display: flex; gap: 7px; align-items: center; }
.cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); cursor: pointer; transition: background var(--t-fast), transform var(--t-fast); }
.cdot:hover { background: var(--fg-hint); }
.cdot.active { background: var(--primary); transform: scale(1.3); }
.carousel-counter { text-align: center; font-size: 11px; color: var(--fg-hint); margin-top: 8px; }

/* --- queue: select + send --- */
.queue-select { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--fg-muted); }
.queue-select input { width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; }
.bulk-bar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--primary-tint); border: 1px solid var(--primary-soft-2); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.bulk-bar .bulk-count { font-size: 13px; font-weight: 600; color: var(--fg); }
.btn-send { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-send:hover { background: var(--primary-hover); }

/* --- modal --- */
.modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(17,17,20,0.45); z-index: 4000; align-items: center; justify-content: center; padding: 20px; }
.modal-backdrop.open { display: flex; }
.modal { background: var(--card); border-radius: 14px; max-width: 460px; width: 100%; box-shadow: 0 18px 50px rgba(15,15,20,0.28); overflow: hidden; }
.modal-head { padding: 18px 22px 6px; font-size: 17px; font-weight: 700; letter-spacing: -0.3px; display: flex; align-items: center; gap: 9px; }
.modal-head svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; }
.modal-body { padding: 4px 22px 18px; font-size: 13.5px; color: var(--fg-muted); line-height: 1.6; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 22px 20px; }
/* wide variant for the pilot-slide explainers: near-fullscreen, scrollable */
.modal.modal-wide { max-width: 680px; }
.modal-wide .modal-body { max-height: 72vh; overflow-y: auto; }
.modal-wide .modal-body h4 { font-size: 13px; font-weight: 700; color: var(--fg); margin: 14px 0 4px; text-transform: uppercase; letter-spacing: 0.4px; }
.modal-wide .modal-body p { margin: 0 0 8px; }
.eng-info-wrap { text-align: center; margin-top: 12px; }
.eng-info-btn { background: none; border: none; color: var(--fg-subtle); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px 8px; }
.eng-info-btn:hover { color: var(--fg); }

/* --- inbox: unread dot + alert pin --- */
.inbox-item.unread { border-left: 3px solid var(--primary); }
.inbox-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); display: inline-block; flex-shrink: 0; }
.inbox-item.read .inbox-item-name { font-weight: 500; color: var(--fg-muted); }
.inbox-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--fg-hint); font-weight: 700; padding: 8px 2px 2px; }
.inbox-hidden-note { font-size: 11.5px; color: var(--fg-subtle); margin-top: 10px; line-height: 1.6; }
.inbox-hidden-note a { color: var(--primary); cursor: pointer; font-weight: 600; }

/* --- Block 20 R2 (2026-10-08): Home, Email activity, the merged survey page and
   the "How this is counted" links. The same block sits in both gyms' templates
   (rule 4); the look is the 10/5 mockup's (Send_It_Preview_*.html). --- */
.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--fg-subtle); font-weight: 700; margin: 26px 0 10px; }
.section-label span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--fg-hint); margin-left: 6px; }
.todo { border-color: var(--primary-soft-2); background: linear-gradient(135deg, var(--primary-tint) 0%, var(--card) 60%); }
.todo-row, .auto-row { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-top: 1px solid var(--border-soft); }
.todo-row:first-child, .auto-row:first-child { border-top: none; }
.todo-count { width: 44px; text-align: center; font-size: 27px; font-weight: 700; letter-spacing: -0.8px; color: var(--primary); line-height: 1; }
.todo-main, .auto-main { flex: 1 1 220px; min-width: 0; }   /* on a phone the button drops under the text (tester 2026-10-08) */
.todo-title { font-size: 14.5px; font-weight: 600; }
.todo-sub, .auto-sub { font-size: 12.5px; color: var(--fg-subtle); margin-top: 2px; }
.auto-title { font-size: 13.5px; font-weight: 500; }
.auto-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); margin: 0 18px; flex-shrink: 0; }
.auto-dot.off { background: var(--border-strong); }
.done { display: flex; align-items: center; gap: 14px; padding: 20px; }
.done-mark { width: 36px; height: 36px; border-radius: 50%; background: var(--success-soft); color: var(--success-fg); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.two-col .card + .card { margin-top: 0; }
.mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mini .mini-label { font-size: 11.5px; color: var(--fg-subtle); }
.mini .mini-value { font-size: 22px; font-weight: 700; letter-spacing: -0.6px; margin-top: 2px; }
.card-foot { border-top: 1px solid var(--border-soft); padding: 8px 16px; }
.link-btn { background: none; border: none; padding: 0; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--primary); cursor: pointer; }
.link-btn:hover { text-decoration: underline; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.back-link { display: inline-block; margin-bottom: 10px; font-size: 12.5px; color: var(--primary); font-weight: 600; cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; }
.back-link:hover { text-decoration: underline; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--fg-subtle); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.tbl td { padding: 8px 8px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr.is-new td { background: var(--primary-tint); }
.tbl .muted { color: var(--fg-hint); font-style: italic; }
.tbl .sub { font-size: 11px; color: var(--fg-subtle); }
.tbl .acts { white-space: nowrap; text-align: right; }
.tbl .acts .link-btn + .link-btn { margin-left: 12px; }
.preview-row td { background: var(--bg-subtle); }
.section-gap { margin-top: 14px; }
details.held > summary { cursor: pointer; list-style: none; padding: 14px 20px; font-size: 13.5px; font-weight: 600; }
details.held > summary::-webkit-details-marker { display: none; }
details.held > summary span { font-size: 11.5px; font-weight: 500; color: var(--fg-hint); margin-left: 8px; }
details.held[open] > summary { border-bottom: 1px solid var(--border-soft); }
.how-link { background: none; border: none; color: var(--fg-subtle); font-size: 11.5px; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 0; margin-top: 4px; font-family: inherit; }
.how-text { display: none; margin-top: 8px; font-size: 12px; color: var(--fg-subtle); max-width: 820px; line-height: 1.6; }
.how-text.open { display: block; }
.home-foot { font-size: 11.5px; color: var(--fg-hint); margin-top: 18px; line-height: 1.6; }
/* Block 23 (2026-10-16): the Home "Gym" card, four numbers across, above the other cards */
.gym-card { margin-bottom: 14px; }
.mini-grid.four { grid-template-columns: repeat(4, 1fr); }
.mini .mini-sub { font-size: 11.5px; color: var(--fg-hint); margin-top: 2px; }
.home-period { margin: 0 0 12px; }
.mini.has-trend .mini-value { display: inline-block; }
.mini .trend { margin-left: 6px; font-size: 13px; vertical-align: 3px; cursor: help; }
.home-period .period-select { flex-shrink: 0; min-width: 160px; }
.home-dates { font-size: 12.5px; color: var(--fg-subtle); }
@media (max-width: 600px) { .mini.has-trend .mini-value { font-size: 18px; } .mini .trend { margin-left: 3px; } }
/* Block 24 arrows: the same three classes ABC's page already had */
.delta-up   { color: var(--success); font-size: 11px; font-weight: 700; white-space: nowrap; }
.delta-down { color: var(--destructive); font-size: 11px; font-weight: 700; white-space: nowrap; }
.delta-flat { color: var(--fg-hint); font-size: 11px; font-weight: 600; white-space: nowrap; }
#how-gym { white-space: pre-line; }   /* one line per number */
@media (max-width: 880px) {
  .mini-grid.four { grid-template-columns: repeat(2, 1fr); row-gap: 14px; }
  .two-col { grid-template-columns: 1fr; }
  .todo-row { flex-wrap: wrap; }
  .tbl { min-width: 560px; }   /* the card scrolls sideways instead of squeezing the cells (tester 2026-10-08) */
}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('nudge-data').textContent);
const $ = id => document.getElementById(id);

function escapeHtml(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
/* Render an email body for display: escape, then turn markdown links [label](url)
   into clickable anchors and linkify any bare http(s) URL left over. */
function formatEmailBody(s) {
  let h = escapeHtml(s);
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (m, label, url) => '<a href="' + url + '" target="_blank" rel="noopener">' + label + ' →</a>');
  h = h.replace(/(^|[\s])(https?:\/\/[^\s<]+)/g,
    (m, pre, url) => pre + '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
  return h;
}
/* Plain-text version (for clipboard): drop markdown link syntax to "label: url". */
function mdToPlain(s) { return String(s == null ? '' : s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '$1: $2'); }
function anchorLabel(a) { return ({ first_visit: 'the first visit', second_visit: 'the second visit', trial_purchase: 'the trial purchase', survey_sent: 'the survey send', last_visit: 'the last visit', last_daypass: 'the last day pass' })[a] || a; }
// Plain names for every email the tool sends (Block 20 R2: Email activity
// shows these, never a raw trigger name). Both gyms' lists are here so the
// function is identical in both templates (rule 4).
const TRIGGER_LABELS = {
  survey_request: 'First-visit survey',
  survey_reminder: 'Survey reminder',
  first_visit_reengage: 'Come-back offer',
  ftv_reminder: 'Come-back offer reminder',
  nudge_round_two: 'Round-two invite',
  nudge_pricing: 'Come-back offer (price)',
  nudge_crowding: 'Come-back offer (crowding)',
  nudge_too_hard: 'Come-back offer (too hard)',
  nudge_intimidating: 'Come-back offer (intimidating)',
  nudge_frontdesk: 'Come-back offer (front desk)',
  nudge_confusing: 'Come-back offer (confusing)',
  nudge_routes: 'Come-back offer (routes)',
  membership_offer: 'Membership offer',
  membership_offer_control: 'Membership offer',
  trial_offer: '2-week trial offer',
  daypass_to_trial: 'Day-pass regulars offer',
  comeback_soft: 'Trial win-back',
  member_check_in: 'Member check-in (day 14)',
  MANUAL: 'Manager call (safety)'
};
function triggerLabel(name) {
  return TRIGGER_LABELS[name] || String(name || '').replace(/_/g, ' ');
}
// Outreach-log rows that are not first-time-visitor emails (the member survey
// program and its replies, the front-desk alert): they live on the Members
// pages, not in Email activity (engine.NON_FTV_TRIGGERS).
const NON_FTV_TRIGGERS = ['member_survey', 'member_check_in', 'member_reply', 'member_auto_reply', 'member_checkin_alert'];
function isFtvTrigger(name) { return NON_FTV_TRIGGERS.indexOf(name) < 0; }
function blockerLabel(b) {
  if (!b) return '';
  return ({
    too_expensive: 'Too expensive',
    too_busy: 'Too busy / crowded',
    too_hard: 'Too hard',
    intimidating: 'Intimidating',
    front_desk: 'Front desk',
    confusing: 'Confusing / lost',
    not_enjoyable: 'Routes weren’t fun'
  })[b] || b.replace(/_/g, ' ');
}
function intentLabel(i) {
  return ({ high: 'High intent', medium: 'On the fence', low: 'Low intent' })[i] || (i || '');
}
function surveyOn() { return !!(DATA.survey && DATA.survey.enabled); }
// survey-status badges for a queue card (only meaningful once the loop is on)
function surveyStatusLine(q) {
  if (!surveyOn()) return '';
  let inner;
  if (q.safety_flag) {
    inner = '<span class="badge badge-destructive">⚠ safety flagged</span>';
  } else if (q.survey_answered) {
    inner = '<span class="badge badge-success">surveyed</span>' +
      (q.blocker ? '<span class="badge badge-warning">' + escapeHtml(blockerLabel(q.blocker)) + '</span>' : '') +
      (q.intent ? '<span class="badge badge-info">' + escapeHtml(intentLabel(q.intent)) + '</span>' : '');
  } else {
    inner = '<span class="ss-await">awaiting survey response</span>';
  }
  return '<div class="queue-survey-status"><span class="ss-label">Survey</span>' + inner + '</div>';
}
function icon(n) {
  const p = { download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    mail:'<path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><polyline points="22,6 12,13 2,6"/>',
    copy:'<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    sparkles:'<path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2L12 3z"/>',
    users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    funnel:'<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
    shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>' }[n] || '';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
}
function pageHeader(title, sub) {
  return '<div class="page-header"><div class="page-title">' + escapeHtml(title) + '</div>' +
    (sub ? '<div class="page-subtitle">' + escapeHtml(sub) + '</div>' : '') + '</div>';
}
function statTile(label, value, sub, red) {
  return '<div class="stat' + (red ? ' stat-red' : '') + '">' +
    '<div class="stat-label">' + escapeHtml(label) + '</div>' +
    '<div class="stat-value">' + value + '</div>' +
    (sub ? '<div class="stat-sub">' + sub + '</div>' : '') + '</div>';
}
function field(label, value) {
  return '<div class="field-cell"><div class="field-label">' + escapeHtml(label) + '</div>' +
    '<div class="field-value">' + escapeHtml(value) + '</div></div>';
}

function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  $('view-' + viewId).classList.add('active');
  // Email activity and a climber's history open from Home (no sidebar entry)
  const navId = (viewId === 'detail' || viewId === 'activity') ? 'home' : viewId;
  const btn = document.querySelector('.nav-btn[data-view="' + navId + '"]');
  if (btn) btn.classList.add('active');
  // Remember the tab so an auto-refresh reload restores it instead of snapping
  // back to Home. sessionStorage survives a reload regardless of whether
  // the meta-refresh keeps the URL hash. Detail is per-climber, so skip it.
  if (viewId !== 'detail') {

/* ============================ EMAIL ACTIVITY (Block 20 R2, decisions 4 + 5) ============================ */
// The Recovery Queue, reshaped as a log: who gets an email on the next run and
// why, who is held back today, and who was sent what. Nothing here sends
// anything (the hand-send code in the server stays switched off; the page no
// longer offers it). Opened from Home; no sidebar entry. Email types show
// their plain names and are filtered by that name, so the two membership-offer
// arms at SHIFT read as one "Membership offer" chip.
let ACT_FILTER = 'all';      // 'all' or a plain email-type name (triggerLabel)
let ACT_PREVIEW = null;      // climber_id whose message preview is open
let ACT_SHOW_ALL = false;    // the next-run table past its first ACT_FOLD rows
const ACT_FOLD = 10;         // next-run rows shown before "Show all"
const ACT_SENT_MAX = 200;    // sent rows shown on the page (the CSV has them all)
function setActFilter(id) { ACT_FILTER = id; ACT_PREVIEW = null; ACT_SHOW_ALL = false; renderActivity(); }
function toggleActPreview(id) { ACT_PREVIEW = ACT_PREVIEW === id ? null : id; renderActivity(); }
function actShowAll() { ACT_SHOW_ALL = true; renderActivity(); }
function actMatches(name) { return ACT_FILTER === 'all' || triggerLabel(name) === ACT_FILTER; }
function actQueue() { return (DATA.queue || []).filter(q => actMatches(q.trigger_name)); }
function actSentRows() { return filteredSentLog().filter(r => actMatches(r.trigger_name)); }
function actChips() {
  const seen = {}, out = [{ id: 'all', label: 'All' }];
  const add = name => { if (!name) return; const l = triggerLabel(name); if (!seen[l]) { seen[l] = true; out.push({ id: l, label: l }); } };
  (DATA.queue || []).forEach(q => add(q.trigger_name));
  filteredSentLog().forEach(r => add(r.trigger_name));
  return out;
}
// "First visit Sep 30, 2026, 6 days ago": the anchor behind the email, plain
function actWhy(q) {
  const a = anchorLabel(q.anchor).replace(/^the /, '');
  const label = a.charAt(0).toUpperCase() + a.slice(1);
  return label + (q.anchor_date ? ' ' + longDate(q.anchor_date) : '') +
    (q.days_since != null ? ', ' + q.days_since + ' ' + plural(q.days_since, 'day', 'days') + ' ago' : '');
}
function reasonLabel(r) {
  return ({ unsubscribed: 'Unsubscribed', already_sent: 'Already got this email', cooldown: 'Got an email recently',
    shared_inbox: 'Shares an email address with another climber', shared_email: 'Shares an email address with another climber',
    group_sent: 'Already got the offer email' })[r] || String(r || '').replace(/_/g, ' ');
}
// Held back today (N), and why: the people who matched an email but are not
// sent one (unsubscribed, emailed recently, a shared address). Folded.
function heldCard(open) {
  const sup = DATA.suppression || {};
  if (!sup.total) return '';
  let h = '<details class="card held section-gap"' + (open ? ' open' : '') + '><summary>Held back today (' + sup.total + '), and why<span>click to show</span></summary>' +

      '<td><span class="badge badge-primary">' + escapeHtml(triggerLabel(w.trigger_name)) + '</span></td>' +
      '<td>' + escapeHtml(reasonLabel(w.reason)) + '</td></tr>';

}

/* --- sent: who was sent what (reads DATA.sent_log, the outreach record) --- */
let EXPORT_PERIOD = 'r:30';
const SENT_PERIOD_OPTS = [['r:30','Last 30 days'],['r:90','Last 90 days'],['r:180','Last 6 months'],['r:365','Last year'],['all','All time']];
// first-time-visitor emails only: the member survey program and its replies
// have their own log on Member Responses
function sentLog() { return (DATA.sent_log || []).filter(r => isFtvTrigger(r.trigger_name)); }
function setExportPeriod(v) { EXPORT_PERIOD = v; renderActivity(); }
function sentCutoff(days) {
  const asof = DATA.as_of || '';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(asof)) return null;
  const d = new Date(asof); d.setDate(d.getDate() - days);
  return d.toISOString().slice(0, 10);
}
function filteredSentLog() {
  const p = EXPORT_PERIOD, all = sentLog();
  if (p === 'all') return all;
  if (p.startsWith('r:')) { const c = sentCutoff(+p.slice(2)); return c ? all.filter(r => (r.sent_date || '') >= c) : all; }
  return all;
}
function csvCell(v) { v = (v == null ? '' : String(v)); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadCsv(name, text) {
  const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportSentLog() {
  const rows = actSentRows();
  if (!rows.length) { toast('No messages were sent in this period yet.'); return; }
  const head = ['Date sent', 'Name', 'Email', 'Message'];
  const body = rows.map(r => [r.sent_date, r.name, r.email, triggerLabel(r.trigger_name)]);
  const csv = [head].concat(body).map(cols => cols.map(csvCell).join(',')).join('\r\n');
  const lbl = (SENT_PERIOD_OPTS.find(o => o[0] === EXPORT_PERIOD) || ['', 'all'])[1].toLowerCase().replace(/ /g, '-');
  downloadCsv('sent-messages_' + lbl + '.csv', csv);
}

/* ============================ SURVEY RESPONSES (one page; Block 20 R2, decision 7a) ============================ */
// Every completed survey, newest first, with the new ones on top and marked
// "New" until someone marks them read. Read state is browser-local
// (localStorage), as the old inbox's was; the response itself always stays in
// the form / on the survey page. "New" = answered inside the inbox window
// (DATA.survey.responses, the last 14 days) and not yet marked read, so an
// old answer never shows as new on a fresh browser.
const SURVEY_PAGE_TITLE = 'Survey Responses';   // the one per-gym line: ABC says "FTV Responses" (decision 8)
const INBOX_READ_KEY = 'shiftInboxRead';
function lsGet(k) { try { return new Set(JSON.parse(localStorage.getItem(k) || '[]')); } catch (e) { return new Set(); } }
function lsSet(k, set) { try { localStorage.setItem(k, JSON.stringify([...set])); } catch (e) {} }
function respKey(r) { return (r.email || '') + '|' + (r.answered_at || '') + '|' + (r.q3_blocker_raw || ''); }
function recentResponses() { return (DATA.survey && DATA.survey.responses) || []; }
function surveyAllRows() { const sv = DATA.survey || {}; return sv.all_responses || sv.responses || []; }
function newSurveyRows() {
  if (!surveyOn()) return [];
  const read = lsGet(INBOX_READ_KEY);
  return recentResponses().filter(r => !read.has(respKey(r)));
}
function newSurveyKeys() { const s = new Set(); newSurveyRows().forEach(r => s.add(respKey(r))); return s; }
// a low first-visit score: the form's 1 to 5 overall answer, 3 or under
function lowOverall(r) { const n = parseInt(String(r.q1_overall || '').trim(), 10); return !isNaN(n) && n <= 3; }
function afterReadChange() { renderSurveys(); refreshInboxBadge(); renderHome(); }
function markSurveyRead(key) { const s = lsGet(INBOX_READ_KEY); s.add(key); lsSet(INBOX_READ_KEY, s); afterReadChange(); }
function markAllSurveysRead() { const s = lsGet(INBOX_READ_KEY); recentResponses().forEach(r => s.add(respKey(r))); lsSet(INBOX_READ_KEY, s); afterReadChange(); }
function refreshInboxBadge() {
  const badge = $('inbox-badge'); if (!badge) return;
  const n = newSurveyRows().length;
  if (n) { badge.textContent = n; badge.style.display = ''; } else { badge.style.display = 'none'; }
}
function cellAns(v) {
  return (v && String(v).trim()) ? escapeHtml(v)
    : '<span style="color:var(--fg-hint);font-style:italic;">(no answer)</span>';
}
function cameBackBadge(cb) {
  if (cb === 'member') return '<span class="badge badge-success">MEMBER</span>';

// one labelled answer (the member detail page reads it; tester 2026-10-08)
function inboxQ(label, ans) {
  const empty = !ans || !String(ans).trim();
  return '<div class="inbox-q"><div class="q-label">' + escapeHtml(label) + '</div>' +

const CAME_BACK_TEXT = 'From check-in data. Yes = checked in again within 30 days of answering. MEMBER = joined a paid membership (not a youth plan; a trial does not count) within 90 days of answering. Too early = answered less than 30 days ago and not back yet. Unknown = the email did not match a climber in your data.';
function renderSurveys() {

// A bar's fill (Luke 2026-09-25): a value of 0 (or 0.0%) draws NO fill at all;
// any other value at least a 2% sliver so it can be seen. `cls` = extra class.
function fillHtml(value, w, cls) {
  if (!(value > 0)) return '';
  return '<div class="bar-fill' + (cls ? ' ' + cls : '') + '" style="width:' +
    Math.min(100, Math.max(Math.round(w), 2)) + '%;"></div>';

function bar(label, n, max) {

    '<div class="card-description">' + escapeHtml(desc) + '</div></div>' +
    '<div class="card-content with-top">' + inner + '</div></div>';

// round a value up to a clean axis maximum (5, 10, 20, 25, 50, ...)
function niceMax(v) {
  if (v <= 5) return 5;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  const steps = [1, 2, 2.5, 5, 10];
  for (let i = 0; i < steps.length; i++) { if (v <= steps[i] * pow) return steps[i] * pow; }
  return 10 * pow;
}
// two-line trend chart (real data: e.g. first-timers vs new members per month)
function trendChart(labels, s1, s2, label1, label2) {
  const W = 760, H = 200, P = { l: 34, r: 14, t: 14, b: 26 };
  const innerW = W - P.l - P.r, innerH = H - P.t - P.b;
  const yMax = niceMax(Math.max(1, Math.max.apply(null, s1.concat(s2))));
  const n = labels.length;
  const xStep = innerW / Math.max(1, n - 1);
  const x = i => P.l + i * xStep;
  const y = v => P.t + innerH - (v / yMax) * innerH;
  let svg = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
  for (let i = 0; i <= 4; i++) {
    const yPos = P.t + (innerH / 4) * i;
    svg += '<line class="chart-grid" x1="' + P.l + '" y1="' + yPos + '" x2="' + (W - P.r) + '" y2="' + yPos + '"/>';
    svg += '<text class="chart-tick" x="' + (P.l - 6) + '" y="' + (yPos + 3) + '" text-anchor="end">' + Math.round(yMax - (yMax / 4) * i) + '</text>';
  }
  svg += '<line class="chart-axis" x1="' + P.l + '" y1="' + (H - P.b) + '" x2="' + (W - P.r) + '" y2="' + (H - P.b) + '"/>';
  const skip = Math.ceil(n / 12);
  labels.forEach((lab, i) => {
    if (i % skip === 0 || i === n - 1) svg += '<text class="chart-tick" x="' + x(i) + '" y="' + (H - P.b + 16) + '" text-anchor="middle">' + escapeHtml(lab) + '</text>';
  });
  const area = s1.map((v, i) => (i === 0 ? 'M' : 'L') + x(i) + ',' + y(v)).join(' ') +
    ' L' + x(n - 1) + ',' + (H - P.b) + ' L' + x(0) + ',' + (H - P.b) + ' Z';
  svg += '<path class="chart-area-you" d="' + area + '"/>';
  svg += '<path class="chart-line-you" d="' + s1.map((v, i) => (i === 0 ? 'M' : 'L') + x(i) + ',' + y(v)).join(' ') + '"/>';
  svg += '<path class="chart-line-mem" d="' + s2.map((v, i) => (i === 0 ? 'M' : 'L') + x(i) + ',' + y(v)).join(' ') + '"/>';
  s1.forEach((v, i) => {
    const tip = labels[i] + ' · ' + label1 + ': ' + v + ' · ' + label2 + ': ' + s2[i];
    svg += '<circle class="chart-dot-you" cx="' + x(i) + '" cy="' + y(v) + '" r="3.5"><title>' + escapeHtml(tip) + '</title></circle>';
    svg += '<circle class="chart-dot-mem" cx="' + x(i) + '" cy="' + y(s2[i]) + '" r="3"><title>' + escapeHtml(tip) + '</title></circle>';
    svg += '<rect x="' + (x(i) - 16) + '" y="' + P.t + '" width="32" height="' + innerH + '" fill="transparent" pointer-events="all"><title>' + escapeHtml(tip) + '</title></rect>';
  });
  svg += '</svg><div class="chart-legend">' +
    '<span><span class="legend-swatch-line"></span>' + escapeHtml(label1) + '</span>' +
    '<span><span class="legend-swatch-mem"></span>' + escapeHtml(label2) + '</span></div>';
  return svg;
}
// single-line percentage trend (y-axis in %), for the over-time chart in % mode
function pctLineChart(labels, series, label) {

  const innerW = W - P.l - P.r, innerH = H - P.t - P.b;
  const yMax = niceMax(Math.max(1, Math.max.apply(null, series)));

  for (let i = 0; i <= 4; i++) {
    const yPos = P.t + (innerH / 4) * i;
    svg += '<line class="chart-grid" x1="' + P.l + '" y1="' + yPos + '" x2="' + (W - P.r) + '" y2="' + yPos + '"/>';
    svg += '<text class="chart-tick" x="' + (P.l - 6) + '" y="' + (yPos + 3) + '" text-anchor="end">' + Math.round(yMax - (yMax / 4) * i) + '%</text>';
  }
  svg += '<line class="chart-axis" x1="' + P.l + '" y1="' + (H - P.b) + '" x2="' + (W - P.r) + '" y2="' + (H - P.b) + '"/>';

  labels.forEach((lab, i) => {

  const area = series.map((v, i) => (i === 0 ? 'M' : 'L') + x(i) + ',' + y(v)).join(' ') +
    ' L' + x(n - 1) + ',' + (H - P.b) + ' L' + x(0) + ',' + (H - P.b) + ' Z';

  series.forEach((v, i) => {
    const tip = labels[i] + ' · ' + label + ': ' + v.toFixed(1) + '%';

  svg += '</svg><div class="chart-legend"><span><span class="legend-swatch-line"></span>' + escapeHtml(label) + '</span></div>';
  return svg;

/* ---- Insights carousel: one chart at a time, Counts/% toggle ---- */

function convBarM(label, n, conv, pct, maxN, maxPct) {

// plain count bar: % mode shows each item's share of the total
function countBarM(label, n, total, maxN) {

// engagement funnel bar: bar scaled to the funnel top (the "sent" row). The
// count shows ONE number: its % of sent in % mode, the count in Counts mode
// (Luke 2026-09-25); the grey sub line is a plain-language source/meaning note.
// A zero value draws NO fill at all, so an empty stage never shows a sliver.
function engBarM(label, n, base, isTop, sub, countOverride, noFill, countScale) {
  // countOverride (2026-09-22, scorecard v2): replaces the count text (one
  // number since 2026-09-25); noFill draws no bar.
  const pct = base > 0 ? 100 * n / base : 0;
  let countHtml;
  if (countOverride) countHtml = escapeHtml(countOverride);
  else if (isTop) countHtml = n.toLocaleString();
  else if (metricIsPct()) countHtml = pct.toFixed(1) + '%';
  else countHtml = n.toLocaleString();
  // one colour in both modes (Luke 2026-09-25). Counts mode: the fill is the
  // count against countScale (the top bar's count) when given, so a count of
  // 4 always shows a bar; % mode: the fill is the %.
  const w = !metricIsPct() && countScale > 0 ? 100 * n / countScale : pct;
  const fill = noFill ? '' : fillHtml(n, w);
  return '<div class="bar-row"><div class="bar-top"><div class="bar-label">' + escapeHtml(label) + '</div>' +

    const be = byEntry(matured);
    inner = be.length
      ? be.map(e => convBarM(e.label, e.n, e.conv, e.pct, Math.max.apply(null, be.map(x => x.n)) || 1, Math.max.apply(null, be.map(x => x.pct)) || 1)).join('')
      : tooNew;
    slides.push({ title: 'Conversion by entry product', desc: 'How the product someone first walks in on changes their odds of joining.', html: inner + howLink('how-entry', joinNote.trim()) });

    const months = [...new Set(plain.map(f => f.m))].sort();
    const mm = [...new Set(matured.map(f => f.m))].sort();   // % mode: the shifted period, like the tiles
    if (months.length > 1 || mm.length > 1) {
      if (metricIsPct()) {
        // the months of the people who have had the join window (a rolling
        // period moves back by the window, as the tiles do)
        const pS = mm.map(m => { const g = matured.filter(f => f.m === m); return 100 * g.filter(f => f[J.key]).length / g.length; });
        slides.push({ title: 'Conversion rate over time', desc: 'The share of each month’s first-timers who joined within ' + J.days + ' days.',
          html: (mm.length > 1 ? pctLineChart(mm.map(monthName), pS, 'Joined within ' + J.days + ' days') : noData('Fewer than two months have people who have had ' + J.days + ' days. Pick a longer period.')) +
            howLink('how-trend', 'Each month counts only the people who have had ' + J.days + ' days (first visits ' + rangeText(J.days) + ').' + joinNote) });
      } else {
        const fS = months.map(m => plain.filter(f => f.m === m).length);
        const mS = months.map(m => plain.filter(f => f.m === m && f[J.key]).length);
        slides.push({ title: 'First-timers and new members over time', desc: 'How many first-timers arrived each month, and how many of them joined within ' + J.days + ' days. The newest months are still filling in.', html: months.length < 2 ? noData('This period covers one month. Pick a longer period to see a trend.') : trendChart(months.map(monthName), fS, mS, 'First-timers', 'Joined within ' + J.days + ' days') });
      }
    }

    const bt = byTiming(plain);
    const totT = bt.reduce((s, b) => s + b.n, 0);
    inner = bt.length
      ? bt.map(b => countBarM(b.k, b.n, totT, Math.max.apply(null, bt.map(x => x.n)) || 1)).join('')
      : noData('No one whose first visit is in this period has joined yet.');
    slides.push({ title: 'When members join', desc: 'Days from a first visit to joining, for everyone in this period who joined. Tells you when a follow-up still has a chance.', html: inner + howLink('how-timing', 'Joined = a paid membership (not a youth plan). Every joiner whose first visit is in the period counts, however long they took (first visits ' + rangeText(0) + ').') });
  }
  if (hasSurvey) {
    // include zero bars for every issue the form CAN name, so "nobody said
    // crowding" is visible rather than missing; small-n note while volume is low
    const counts = Object.assign({}, sv.by_blocker || {});
    (sv.blocker_options || []).forEach(o => { if (!(o in counts)) counts[o] = 0; });
    const be = Object.entries(counts).sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]));
    const totB = be.reduce((s, e) => s + e[1], 0);
    let inner = totB > 0
      ? be.map(([b, n]) => countBarM(blockerLabel(b), n, totB, Math.max.apply(null, be.map(e => e[1])) || 1)).join('')
      : noData('No blockers reported yet.');
    if (responses.length && responses.length < 10) {
      inner += '<div style="color:var(--fg-subtle);font-size:11.5px;margin-top:10px;">Early read: only ' +
        responses.length + (responses.length === 1 ? ' survey' : ' surveys') + ' answered so far.</div>';
    }
    slides.push({ title: 'Why first-timers hesitate', fixed: true, desc: 'The blocker each respondent named, every answer so far. This is what each recovery message answers.', html: inner });

    const intents = { high: 0, medium: 0, low: 0 };
    responses.forEach(r => { if (r.intent && intents[r.intent] != null) intents[r.intent]++; });
    const totI = intents.high + intents.medium + intents.low;
    inner = totI
      ? ['high', 'medium', 'low'].filter(k => intents[k]).map(k => countBarM(intentLabel(k), intents[k], totI, Math.max(intents.high, intents.medium, intents.low))).join('')
      : noData('No intent answers yet.');
    slides.push({ title: 'How likely to become regulars', fixed: true, desc: 'Self-reported intent, every answer so far. High-intent first-timers get the round-two invite.', html: inner });
  }
  // Pilot engagement funnels (survey + offer emails). These read the send log,
  // so they cover the whole pilot and ignore the period picker above.
  // the scorecard and the sheet's email slides do not read the send log, so
  // they show even when the log is empty or its pull failed (tester 9/24)
  if (engagementOn() || erData() || (DATA.scorecard || {}).enabled) {
    const eng = DATA.engagement || {};
    const av = !!eng.activity_available;
    const pilotDay0 = eng.visit_floor || eng.pilot_start;  // go-live date (first eligible first visit)
    let dayNote = '';
    if (pilotDay0) {
      const ms = new Date(DATA.as_of) - new Date(pilotDay0);
      const day = Math.floor(ms / 86400000) + 1;
      dayNote = day <= 90 ? ' Day ' + day + ' of the 90-day pilot.' : ' The 90-day pilot window has ended.';
    }
    const engNote = dayNote + ' Covers everyone emailed since ' +
      (eng.pilot_start ? longDate(eng.pilot_start) : 'the pilot started') + '.';
    const foot = t => '<div style="color:var(--fg-subtle);font-size:11.5px;margin-top:10px;">' + escapeHtml(t) + '</div>';
    const fetching = 'Opens and clicks are still being fetched from the email system; check back in a few minutes.';
    const openSub = 'From the email system. Runs a little high: some mail apps open emails automatically.';
    // Pilot scorecard: every first-timer whose FIRST VISIT fell inside the
    // pilot window (emailed or not), from the same reporting cohort as the
    // funnel. Windowed on the go-live visit floor (first visits on/after
    // 6/19), NOT the first send date, so day-one first-timers count. Goal
    // numbers = the pilot scorecard agreed 2026-06-18 vs the same-window
    // summer-2025 baseline: 30-33% return within 30 days (baseline 23%),
    // 4-5% membership conversion within 90 days (baseline 2.9%).
    // v2 (2026-09-22, ROADMAP Block 12): the engine ships the three bars
    // already screened and windowed (engine.build_scorecard), next to the
    // same calendar dates one year earlier under the same rules. The old
    // client-side count below stays as the fallback for clients without a
    // reporting.scorecard block (the demo clients).
    const sc = DATA.scorecard || {};
    if (hasReport && sc.enabled && sc.pilot && sc.pilot.all.n > 0) {
      slides.push(scorecardSlideV2(sc));
    } else if (hasReport && pilotDay0) {
      const pcohort = (DATA.reporting.ftvs || []).filter(f => f.d >= pilotDay0);
      const pN = pcohort.length;
      if (pN > 0) {
        // demo clients only (no reporting.scorecard): the records' windowed
        // flags since Block 15 session 3 (came back within 30 days, joined
        // within 90), not yet cut to the people who have had that long
        const pRet = pcohort.filter(f => f.ret30).length;
        const pConv = pcohort.filter(f => f.j90).length;
        let inner = engBarM('Qualified first-timers since the pilot started', pN, pN, true,
          'Everyone who bought their own first pass and checked in during the pilot, emailed or not. Guests on someone else’s pass aren’t counted here (the survey still reaches them).');
        inner += engBarM('Came back within 30 days', pRet, pN, false,
          'The pilot’s main goal: 30 to 33% back within 30 days (last summer: 23%). Reads low early; the newest first-timers haven’t had time to come back yet.');
        inner += engBarM('Joined within 90 days', pConv, pN, false,
          'The pilot goal: 4 to 5% within 90 days of the first visit (last summer: 2.9%). Day-pass buyers average about 3 months to join, so this reads low until late in the pilot.');
        inner += engInfoBtn('scorecard');
        slides.push({ title: 'Pilot scorecard', pilot: true,
          desc: 'The big picture: every first-timer since the pilot began and what they did next.' + engNote.replace(/Covers everyone emailed since [^.]+/, 'Covers first visits since ' + longDate(pilotDay0)),
          html: inner });
      }
    }
    // Email results = the All Gyms sheet's own rows (Block 15 session 3). The
    // older per-person funnels below now show only for a demo client, which
    // has no row on the sheet.
    const er = emailResultSlides();
    if (er) er.forEach(x => slides.push(x));
    const s = er ? {} : (eng.surveys || {});
    if ((s.sent || 0) > 0) {
      const paidN = s.sent_paid_ftv || 0;
      const paidSplit = paidN > 0
        ? 'Of the ' + s.sent.toLocaleString() + ', ' + paidN.toLocaleString() +
          ' went to first-timers counted on the Pilot scorecard; the rest went to guests and others who checked in with their own email.'
        : 'Includes guests and others who checked in with their own email, so this runs higher than the scorecard’s paid first-timer count.';
      let inner = engBarM('Survey emails sent (all new visitors)', s.sent, s.sent, true,
        'Everyone gets the survey 1 to 2 days after their first visit. ' + paidSplit);
      if (av) {
        inner += engBarM('Opened the email', s.opened, s.sent, false, openSub);
        inner += engBarM('Clicked the survey link', s.clicked_survey, s.sent, false,
          'Clicked through to the feedback form.');
      }
      inner += engBarM('Answered the survey', s.responded, s.sent, false, 'Submitted the form.');
      if (!av) inner += foot(fetching);
      inner += engInfoBtn('survey');
      slides.push({ title: 'Survey engagement', pilot: true, desc: 'How first-timers engage with the feedback survey.' + engNote, html: inner });
    }
    const o = er ? {} : (eng.offers || {});
    if ((o.sent || 0) > 0) {
      let inner = engBarM('Sent the come-back offer', o.sent, o.sent, true,
        'Only goes to first-timers who had not come back about a week after their visit. Fast returners never need it.');
      if (av) {
        inner += engBarM('Opened the email', o.opened, o.sent, false, openSub);
        inner += engBarM('Clicked the buy-a-pass link', o.clicked_buy, o.sent, false,
          'Clicked through to Shift’s pass-purchase page. Tracked by the email system.');
      }
      inner += engBarM('Redeemed the code (50% off a day pass)', o.redeemed, o.sent, false,
        'Bought a half-off day pass within 30 days of the offer, from register data. The desk must ring it up as a discount to count.');
      inner += engBarM('Came back within 30 days of the offer', o.returned, o.sent, false,
        'Checked in again within 30 days after the offer went out, with or without the code. From check-in data.');
      if (!av) inner += foot(fetching);
      inner += engInfoBtn('offer');
      slides.push({ title: 'Offer email results', pilot: true, desc: 'The 50%-off come-back offer and what happened next.' + engNote, html: inner });
    }
  }
  return slides;
}
function renderInsights() {
  const sv = DATA.survey || {};
  // all-time list (fallback: the inbox-windowed one), so survey slides don't
  // vanish once every response is older than the inbox window
  const responses = sv.all_responses || sv.responses || [];
  const hasReport = reportingOn();
  const hasSurvey = surveyOn() && responses.length > 0;

  let h = pageHeader('Insights',
    'What ' + DATA.client + '’s first-visit data is telling us. Pick a period, then step through each chart.');

  if (!hasReport && !hasSurvey && !engagementOn() && !erData()) {
    h += '<div class="card"><div class="empty-state"><div class="empty-state-icon">📊</div>' +
      '<div class="empty-state-title">No data yet</div>' +
      '<div class="empty-state-msg">Insights populate from your visit data and the survey.</div></div></div>';
    $('view-insights').innerHTML = h; return;
  }

  // carousel: one chart at a time, arrows + dots to cycle
  const slides = buildInsightSlides(hasReport, hasSurvey, sv, responses);
  if (INSIGHTS_SLIDE >= slides.length) INSIGHTS_SLIDE = 0;
  const cur = slides[INSIGHTS_SLIDE] || { title: '', desc: '', html: '' };

  // fixed controls (period + counts/%) stay pinned above the carousel. The
  // pilot slides always cover the whole pilot and the survey-answer slides
  // every answer (`fixed`, audit S8), so the period picker is hidden on them
  // (it would change nothing and only invite confusion).
  h += '<div class="insights-controls">' + (hasReport && !cur.pilot && !cur.fixed ? periodSelectHtml() : '') + metricToggleHtml() + '</div>';
  h += '<div class="carousel">' +
    '<div class="carousel-head"><div class="card-title">' + icon('sparkles') + escapeHtml(cur.title) + '</div>' +
      '<div class="card-description">' + escapeHtml(cur.desc) + '</div></div>' +
    '<div class="carousel-body">' + cur.html + '</div>' +
    '<div class="carousel-nav">' +
      '<button class="carousel-arrow" onclick="insightsGoto(' + (INSIGHTS_SLIDE - 1) + ',' + slides.length + ')" aria-label="Previous chart">‹</button>' +
      '<div class="carousel-dots">' +
        slides.map((s, i) => '<span class="cdot' + (i === INSIGHTS_SLIDE ? ' active' : '') + '" title="' + escapeHtml(s.title) + '" onclick="insightsGoto(' + i + ',' + slides.length + ')"></span>').join('') +
      '</div>' +
      '<button class="carousel-arrow" onclick="insightsGoto(' + (INSIGHTS_SLIDE + 1) + ',' + slides.length + ')" aria-label="Next chart">›</button>' +
    '</div>' +
    '<div class="carousel-counter">' + (INSIGHTS_SLIDE + 1) + ' of ' + slides.length + '</div>' +
  '</div>';

  $('view-insights').innerHTML = h;
}

function setupSurveyNav() {
  const insights = $('nav-insights'), surveys = $('nav-surveys');
  const label = $('survey-nav-label');   // SHIFT's "Survey loop" section label; ABC has none
  // Insights is always available now (it includes behavior reporting, not just survey).
  insights.onclick = () => showView('insights');
  renderInsights();
  if (surveyOn()) {
    if (label) label.textContent = 'Survey loop';
    surveys.onclick = () => showView('surveys');
    renderSurveys();
    refreshInboxBadge();
  } else {
    if (label) label.textContent = 'Coming with the survey loop';
    surveys.style.opacity = '0.5'; surveys.style.cursor = 'not-allowed';
    surveys.onclick = () => toast('Survey responses appear once the survey loop is on');
  }
}

/* ============================ shared actions ============================ */
function copyEmail(id) {
  const q = DATA.queue.find(x => x.climber_id === id);
  if (!q) return;
  const text = 'To: ' + q.email + '\nSubject: ' + q.subject + '\n\n' + mdToPlain(q.body_preview);
  navigator.clipboard.writeText(text).then(() => toast('Email text copied to clipboard'),
                                          () => toast('Copy failed - select manually'));
}
function toast(msg) {
  const host = $('toast-host');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// init
REPORT_PERIOD = reportingOn() ? defaultPeriod() : 'all';
restoreInsightsState();   // re-apply period / counts-% / chart after an auto-refresh reload
$('brand-sub').textContent = DATA.client || 'Send It';
renderHome();
renderActivity();
setupSurveyNav();
if (typeof setupMembersNav === 'function') setupMembersNav();   // ABC's Members pages (absent at SHIFT)

// Restore the tab across auto-refresh reloads (so a periodic refresh doesn't
// snap the reader back to Home). The old page names (a bookmark, a stored
// tab from before Block 20 R2) map onto the pages that replaced them.
(function restoreView() {
  let id = '';
  try { id = sessionStorage.getItem('shiftActiveView') || ''; } catch (e) {}
  if (!id) id = (location.hash || '').replace('#', '');
  id = ({ dashboard: 'home', queue: 'activity', inbox: 'surveys', 'm-overview': 'home' })[id] || id;
  const hasMembers = typeof membersOn === 'function' && membersOn();
  const mvalid = ['m-responses', 'm-recognition', 'm-insights', 'm-settings'];   // m-settings: no sidebar entry, hash only (decision 7b)
  if (mvalid.includes(id)) { if (hasMembers) showView(id); return; }
  if (id === 'm-respdetail') { if (hasMembers) showView('m-responses'); return; }
  const valid = ['home', 'activity', 'surveys', 'insights'];
  if (!valid.includes(id) || id === 'home') return;
  if (id === 'surveys' && !surveyOn()) return;
  showView(id);
})();
</script>
