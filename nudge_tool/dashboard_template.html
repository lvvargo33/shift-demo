<!DOCTYPE html>
<!--
  shift-nudge-tool dashboard. Reuses the "Send It" Lovable skin (CSS verbatim
  from Redesign/Shift_ABC_Prep/New_HTML/ftv_mvp_demo_v2_shift.html). Views built
  on REAL Beta-export data (FTV_PILOT_SPEC.md section 14): Dashboard, Recovery
  Queue, Detail, Funnel, Settings. Inbox + Insights are survey-driven and arrive
  with the survey loop (S2); they are intentionally absent until then.

  The tool injects the run's data into the <script id="nudge-data"> tag below
  (replacing __DATA_JSON__), so this is a single self-contained file: no server,
  no fetch. It is a VIEW of who would be tagged; it never sends anything.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send It</title>
<style>
:root {
  --bg:               #F7F7F8;
  --bg-subtle:        #FAFAFB;
  --card:             #FFFFFF;
  --border:           #E5E5E8;
  --border-strong:    #D4D4D8;
  --border-soft:      #EFEFF1;
  --fg:               #111114;
  --fg-muted:         #4B4B53;
  --fg-subtle:        #71717A;
  --fg-hint:          #A1A1AA;
  --primary:          #BE4528;
  --primary-hover:    #A53D22;
  --primary-fg:       #FFFFFF;
  --primary-soft:     #FBE6DC;
  --primary-soft-2:   #F4CFBE;
  --primary-tint:     #FFF6F1;
  --red-tile-bg:      #FEF1EC;
  --red-tile-border:  #F4C2AE;
  --success:          #16A34A;
  --success-soft:     #DCFCE7;
  --success-fg:       #14532D;
  --success-tint:     #F0FDF4;
  --warning:          #D97706;
  --warning-soft:     #FED7AA;
  --warning-fg:       #7C2D12;
  --warning-tint:     #FFF7ED;
  --destructive:      #DC2626;
  --destructive-soft: #FEE2E2;
  --destructive-fg:   #7F1D1D;
  --destructive-tint: #FEF2F2;
  --info:             #2563EB;
  --info-soft:        #DBEAFE;
  --info-fg:          #1E3A8A;
  --radius-sm:        6px;
  --radius:           10px;
  --radius-lg:        14px;
  --shadow-xs: 0 1px 2px 0 rgba(15,15,20,0.04);
  --shadow-sm: 0 1px 3px 0 rgba(15,15,20,0.05), 0 1px 2px -1px rgba(15,15,20,0.04);
  --shadow-card: 0 1px 2px 0 rgba(15,15,20,0.04);
  --t-fast: 120ms cubic-bezier(0.16, 1, 0.3, 1);
  --t-norm: 180ms cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, textarea, select { font-family: inherit; }

.sidebar { position: fixed; inset: 0 auto 0 0; width: 248px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1000; }
.sidebar-header { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 18px; border-bottom: 1px solid var(--border-soft); }
.sidebar-logo { width: 30px; height: 30px; border-radius: 7px; background: linear-gradient(135deg, var(--primary) 0%, #A53D22 100%); color: var(--primary-fg); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; letter-spacing: -0.5px; box-shadow: 0 1px 2px rgba(190,69,40,0.25); }
.sidebar-brand-name { font-size: 14px; font-weight: 600; letter-spacing: -0.2px; color: var(--fg); line-height: 1.2; }
.sidebar-brand-sub { font-size: 11px; color: var(--fg-subtle); line-height: 1.3; margin-top: 1px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 1px; padding: 10px; flex: 1; overflow-y: auto; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; background: transparent; border-radius: 7px; cursor: pointer; color: var(--fg-muted); font-size: 13px; font-weight: 500; text-align: left; transition: background var(--t-fast), color var(--t-fast); }
.nav-btn:hover { background: var(--bg-subtle); color: var(--fg); }
.nav-btn.active { background: var(--primary); color: var(--primary-fg); box-shadow: 0 1px 2px rgba(190,69,40,0.20); }
.nav-btn.active:hover { background: var(--primary-hover); }
.nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-badge { margin-left: auto; background: var(--primary-soft); color: var(--primary); font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 8px; }
.nav-btn.active .nav-badge { background: rgba(255,255,255,0.22); color: #fff; }
.nav-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--fg-hint); font-weight: 700; padding: 14px 10px 4px; }
.sidebar-footer { border-top: 1px solid var(--border-soft); padding: 12px 14px; }
.user-chip { font-size: 11px; color: var(--fg-subtle); margin-bottom: 6px; word-break: break-all; }

.main { margin-left: 248px; min-height: 100vh; }
.main-inner { max-width: 1140px; margin: 0 auto; padding: 32px 36px 60px; }
.view { display: none; }
.view.active { display: block; }

.page-header { margin-bottom: 26px; }
.page-title { font-size: 28px; font-weight: 700; letter-spacing: -0.6px; color: var(--fg); line-height: 1.2; }
.page-subtitle { margin-top: 8px; font-size: 14px; color: var(--fg-muted); max-width: 720px; line-height: 1.55; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-card); overflow: hidden; }
.card + .card { margin-top: 14px; }
.card-header { padding: 18px 20px 12px; }
.card-title { font-size: 15.5px; font-weight: 600; letter-spacing: -0.2px; color: var(--fg); display: flex; align-items: center; gap: 8px; }
.card-title svg { width: 14px; height: 14px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.card-description { margin-top: 4px; font-size: 12.5px; color: var(--fg-subtle); line-height: 1.5; }
.card-content { padding: 0 20px 20px; }
.card-content.with-top { padding-top: 16px; }
.card.card-highlight { background: linear-gradient(135deg, var(--primary-tint) 0%, var(--card) 60%); border-color: var(--primary-soft-2); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast); white-space: nowrap; }
.btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); box-shadow: 0 1px 2px rgba(190,69,40,0.2); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-outline { background: var(--card); color: var(--fg); border-color: var(--border-strong); }
.btn-outline:hover { background: var(--bg-subtle); border-color: var(--fg-hint); }
.btn-ghost { background: transparent; color: var(--fg-muted); }
.btn-ghost:hover { background: var(--bg-subtle); color: var(--fg); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--bg-subtle); color: var(--fg-muted); border: 1px solid var(--border); white-space: nowrap; }
.badge-primary    { background: var(--primary-soft);     color: var(--primary);      border-color: var(--primary-soft-2); }
.badge-success    { background: var(--success-soft);     color: var(--success-fg);   border-color: #BBF7D0; }
.badge-warning    { background: var(--warning-soft);     color: var(--warning-fg);   border-color: #FDBA74; }
.badge-destructive{ background: var(--destructive-soft); color: var(--destructive-fg); border-color: #FECACA; }
.badge-info       { background: var(--info-soft);        color: var(--info-fg);      border-color: #BFDBFE; }

.stats-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0 22px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px 14px; box-shadow: var(--shadow-card); transition: border-color var(--t-fast); }
.stat:hover { border-color: var(--border-strong); }
.stat.stat-red { border-color: var(--red-tile-border); background: var(--red-tile-bg); }
.stat-label { font-size: 12px; font-weight: 500; color: var(--fg-subtle); }
.stat.stat-red .stat-label { color: var(--destructive-fg); }
.stat-value { margin-top: 8px; font-size: 27px; font-weight: 700; letter-spacing: -0.8px; color: var(--fg); line-height: 1.05; }
.stat.stat-red .stat-value { color: var(--destructive); }
.stat-sub { margin-top: 4px; font-size: 11.5px; color: var(--fg-hint); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--card); color: var(--fg-muted); font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast); }
.chip:hover { background: var(--bg-subtle); color: var(--fg); }
.chip.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); box-shadow: 0 1px 2px rgba(190,69,40,0.18); }

.queue-card { margin-bottom: 8px; background: #FEF1EC; border-color: #F4C2AE; }
.queue-card .card-header { display: block; padding: 12px 16px 4px; }
.queue-card .card-content { padding: 0 16px 12px; }
.queue-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.queue-name { font-size: 14.5px; font-weight: 600; color: var(--fg); letter-spacing: -0.15px; cursor: pointer; }
.queue-name:hover { color: var(--primary); text-decoration: underline; }
.queue-email { font-size: 11px; color: var(--fg-subtle); margin-top: 1px; }
.queue-fields { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; font-size: 12.5px; margin: 6px 0 2px; }
@media (min-width: 768px) { .queue-fields { grid-template-columns: repeat(4, 1fr); } }
.field-cell .field-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--fg-subtle); font-weight: 600; }
.field-cell .field-value { margin-top: 1px; font-weight: 500; color: var(--fg); font-size: 12.5px; }
.queue-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-soft); }
.queue-expand-btn { background: transparent; border: none; cursor: pointer; padding: 4px 0 2px; font-size: 12px; color: var(--primary); font-weight: 500; }
.queue-expand-btn:hover { text-decoration: underline; }
.queue-survey-panel { display: none; padding: 12px 14px; background: rgba(255,255,255,0.6); border: 1px solid var(--border-soft); border-radius: 7px; margin-top: 6px; }
.queue-survey-panel.open { display: block; }
.inline-badges { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.email-subject { font-weight: 600; color: var(--fg); margin-bottom: 6px; font-size: 13px; }
.email-body { color: var(--fg-muted); white-space: pre-wrap; font-size: 12.5px; line-height: 1.55; }

.banner { border-radius: var(--radius); padding: 12px 16px; margin-bottom: 20px; font-size: 13px; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
.banner svg { width: 17px; height: 17px; flex-shrink: 0; margin-top: 1px; stroke: currentColor; fill: none; stroke-width: 2; }
.banner-safe { background: var(--success-tint); border: 1px solid #BBF7D0; color: var(--success-fg); }
.banner-warn { background: var(--warning-tint); border: 1px solid #FDBA74; color: var(--warning-fg); }

.empty-state { text-align: center; padding: 38px 22px; color: var(--fg-subtle); }
.empty-state-icon { width: 42px; height: 42px; margin: 0 auto 12px; border-radius: 50%; background: var(--bg-subtle); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--fg-hint); font-size: 22px; }
.empty-state-title { font-size: 14.5px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
.empty-state-msg { font-size: 12.5px; max-width: 360px; margin: 0 auto; line-height: 1.55; }

/* --- behavior-priorities mini cards (Dashboard hero) --- */
.prio-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); padding-top: 8px; padding-bottom: 14px; }
.prio-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; box-shadow: var(--shadow-xs); }
.prio-count { font-size: 10.5px; color: var(--fg-subtle); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
.prio-count strong { color: var(--primary); font-size: 13px; }
.prio-title { font-size: 14.5px; font-weight: 600; margin-top: 4px; letter-spacing: -0.2px; }
.prio-desc { font-size: 12px; color: var(--fg-muted); margin-top: 4px; line-height: 1.45; }

/* --- funnel --- */
.funnel-row { margin: 0 0 16px; }
.funnel-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 5px; }
.funnel-label { font-size: 13.5px; font-weight: 600; color: var(--fg); }
.funnel-count { font-size: 13px; color: var(--fg-muted); font-weight: 600; white-space: nowrap; }
.funnel-track { height: 30px; background: var(--bg-subtle); border: 1px solid var(--border-soft); border-radius: 7px; overflow: hidden; }
.funnel-fill { height: 100%; background: linear-gradient(90deg, var(--primary) 0%, #A53D22 100%); display: flex; align-items: center; padding-left: 10px; color: #fff; font-size: 11.5px; font-weight: 700; min-width: 38px; transition: width var(--t-norm); }
.funnel-note { font-size: 11px; color: var(--fg-hint); margin-top: 4px; }

/* --- detail --- */
.detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; font-size: 13px; }
@media (min-width: 768px) { .detail-grid { grid-template-columns: repeat(3, 1fr); } }
.visit-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.visit-chip { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--bg-subtle); border: 1px solid var(--border); color: var(--fg-muted); font-weight: 500; }

/* --- settings / config --- */
.cfg-row { display: grid; grid-template-columns: 168px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border-soft); font-size: 12.5px; }
.cfg-row:last-child { border-bottom: none; }
.cfg-key { color: var(--fg-subtle); font-weight: 600; }
.cfg-val { color: var(--fg); }
.cfg-trigger { padding: 11px 0; border-bottom: 1px solid var(--border-soft); }
.cfg-trigger:last-child { border-bottom: none; }
.cfg-trigger-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cfg-trigger-name { font-weight: 600; font-size: 13px; }
.cfg-trigger-meta { font-size: 11.5px; color: var(--fg-subtle); margin-top: 4px; line-height: 1.5; }
.cfg-trigger.cfg-waiting { opacity: 0.7; }

.hamburger { display: none; position: fixed; top: 12px; left: 12px; z-index: 1500; background: var(--card); border: 1px solid var(--border-strong); border-radius: 8px; width: 40px; height: 40px; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-sm); }
.hamburger svg { width: 20px; height: 20px; stroke: var(--fg); fill: none; stroke-width: 2; }
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(17,17,20,0.4); z-index: 999; }
.sidebar-backdrop.open { display: block; }

@media (max-width: 880px) {
  .hamburger { display: flex; }
  .sidebar { transform: translateX(-100%); transition: transform var(--t-norm); }
  .sidebar.open { transform: translateX(0); box-shadow: 6px 0 20px rgba(0,0,0,0.18); }
  .main { margin-left: 0; }
  .main-inner { padding: 60px 16px 40px; }
  .page-title { font-size: 22px; }
  .stats-grid-3 { grid-template-columns: 1fr 1fr; }
  .stat { padding: 12px 14px 10px; }
  .stat-value { font-size: 22px; }
  .queue-card .card-header { padding: 10px 14px 4px; }
  .queue-card .card-content { padding: 0 14px 10px; }
  .queue-actions .btn { padding: 6px 8px; font-size: 11.5px; }
  .cfg-row { grid-template-columns: 1fr; gap: 2px; }
}
@media (max-width: 500px) { .stats-grid-3 { grid-template-columns: 1fr; } }
.toast-host { position: fixed; bottom: 18px; right: 18px; z-index: 3000; pointer-events: none; }
.toast { background: var(--fg); color: #fff; border-radius: 8px; padding: 10px 14px; font-size: 13px; box-shadow: 0 8px 24px rgba(15,15,20,0.18); }

/* --- survey status line on queue cards --- */
.queue-survey-status { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin: 6px 0 2px; font-size: 12px; }
.queue-survey-status .ss-label { color: var(--fg-subtle); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.queue-survey-status .ss-await { color: var(--fg-hint); font-style: italic; }

/* --- withheld (suppression) card --- */
.withheld-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 0; border-bottom: 1px solid var(--border-soft); font-size: 12.5px; }
.withheld-row:last-child { border-bottom: none; }
.withheld-name { font-weight: 600; }
.withheld-email { color: var(--fg-subtle); font-size: 11px; }

/* --- inbox (survey responses, two-pane) --- */
.inbox-layout { display: grid; grid-template-columns: 310px 1fr; gap: 14px; align-items: start; }
@media (max-width: 880px) { .inbox-layout { grid-template-columns: 1fr; } }
.inbox-list { display: flex; flex-direction: column; gap: 6px; max-height: 72vh; overflow-y: auto; padding-right: 2px; }
.inbox-item { text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: border-color var(--t-fast), background var(--t-fast); }
.inbox-item:hover { border-color: var(--border-strong); background: var(--bg-subtle); }
.inbox-item.active { border-color: var(--primary); background: var(--primary-tint); }
.inbox-item-name { font-weight: 600; font-size: 13px; color: var(--fg); }
.inbox-item-meta { font-size: 11px; color: var(--fg-subtle); margin-top: 3px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.inbox-q { margin-bottom: 13px; }
.inbox-q .q-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--fg-subtle); font-weight: 600; }
.inbox-q .q-ans { font-size: 14px; color: var(--fg); margin-top: 2px; white-space: pre-wrap; line-height: 1.5; }
.inbox-q .q-ans.muted { color: var(--fg-hint); font-style: italic; }

/* --- insights bars --- */
.bar-row { margin-bottom: 11px; }
.bar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12.5px; margin-bottom: 4px; }
.bar-label { font-weight: 600; color: var(--fg); }
.bar-count { color: var(--fg-muted); font-weight: 600; white-space: nowrap; }
.bar-track { height: 22px; background: var(--bg-subtle); border: 1px solid var(--border-soft); border-radius: 6px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary) 0%, #A53D22 100%); min-width: 2px; transition: width var(--t-norm); }
</style>
</head>
<body>

<button class="hamburger" onclick="toggleMobileNav()" aria-label="Open menu">
  <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleMobileNav()"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">S</div>
    <div>
      <div class="sidebar-brand-name">Send It</div>
      <div class="sidebar-brand-sub" id="brand-sub">Send It</div>
    </div>
  </div>
  <div class="sidebar-nav">
    <button class="nav-btn active" data-view="dashboard" onclick="showView('dashboard')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      Dashboard
    </button>
    <button class="nav-btn" data-view="queue" onclick="showView('queue')">
      <svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      Recovery Queue
      <span class="nav-badge" id="queue-badge">0</span>
    </button>
    <button class="nav-btn" data-view="funnel" onclick="showView('funnel')">
      <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      Funnel
    </button>
    <button class="nav-btn" data-view="settings" onclick="showView('settings')">

<script id="nudge-data" type="application/json">__DATA_JSON__</script>
<script>
const DATA = JSON.parse(document.getElementById('nudge-data').textContent);
const $ = id => document.getElementById(id);

function escapeHtml(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function anchorLabel(a) { return ({ first_visit: 'the first visit', trial_purchase: 'the trial purchase', survey_sent: 'the survey send', last_visit: 'the last visit', last_daypass: 'the last day pass' })[a] || a; }
function triggerLabel(name) {
  return ({
    survey_request: 'First-visit survey',
    comeback_soft: 'Trial win-back',
    daypass_to_trial: 'Day-pass upsell',
    nudge_round_two: 'Round two (high intent)',
    nudge_pricing: 'Pricing blocker',
    nudge_crowding: 'Crowding blocker',
    nudge_too_hard: 'Too-hard blocker',
    nudge_intimidating: 'Intimidating blocker',
    nudge_frontdesk: 'Front-desk blocker',
    nudge_confusing: 'Confusing blocker',
    nudge_routes: 'Routes blocker',
    MANUAL: 'Manager call (safety)'
  })[name] || name.replace(/_/g, ' ');
}
function blockerLabel(b) {
  if (!b) return '';
  return ({
    too_expensive: 'Too expensive',
    too_busy: 'Too busy / crowded',
    too_hard: 'Too hard',
    intimidating: 'Intimidating',
    front_desk: 'Front desk',
    confusing: 'Confusing / lost',
    not_enjoyable: 'Routes weren’t fun'
  })[b] || b.replace(/_/g, ' ');
}
function intentLabel(i) {
  return ({ high: 'High intent', medium: 'On the fence', low: 'Low intent' })[i] || (i || '');
}
function surveyOn() { return !!(DATA.survey && DATA.survey.enabled); }
// survey-status badges for a queue card (only meaningful once the loop is on)
function surveyStatusLine(q) {
  if (!surveyOn()) return '';
  let inner;
  if (q.safety_flag) {
    inner = '<span class="badge badge-destructive">⚠ safety flagged</span>';
  } else if (q.survey_answered) {
    inner = '<span class="badge badge-success">surveyed</span>' +
      (q.blocker ? '<span class="badge badge-warning">' + escapeHtml(blockerLabel(q.blocker)) + '</span>' : '') +
      (q.intent ? '<span class="badge badge-info">' + escapeHtml(intentLabel(q.intent)) + '</span>' : '');
  } else {
    inner = '<span class="ss-await">awaiting survey response</span>';
  }
  return '<div class="queue-survey-status"><span class="ss-label">Survey</span>' + inner + '</div>';
}
function prioAction(name) {
  return ({
    survey_request: 'Send the first-visit survey so the next message can be matched to the real blocker.',
    comeback_soft: 'Win back trial buyers who bought in but never came back.',
    daypass_to_trial: 'Upsell day-pass regulars to the 2-week trial before the habit fades.'
  })[name] || 'In the recovery queue this run.';
}
function icon(n) {
  const p = { download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    mail:'<path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><polyline points="22,6 12,13 2,6"/>',
    copy:'<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    sparkles:'<path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2L12 3z"/>',
    users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    funnel:'<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
    shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>' }[n] || '';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
}
function pageHeader(title, sub) {
  return '<div class="page-header"><div class="page-title">' + escapeHtml(title) + '</div>' +
    (sub ? '<div class="page-subtitle">' + escapeHtml(sub) + '</div>' : '') + '</div>';
}
function statTile(label, value, sub, red) {
  return '<div class="stat' + (red ? ' stat-red' : '') + '">' +
    '<div class="stat-label">' + escapeHtml(label) + '</div>' +
    '<div class="stat-value">' + value + '</div>' +
    (sub ? '<div class="stat-sub">' + sub + '</div>' : '') + '</div>';
}
function field(label, value) {
  return '<div class="field-cell"><div class="field-label">' + escapeHtml(label) + '</div>' +
    '<div class="field-value">' + escapeHtml(value) + '</div></div>';
}

function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  $('view-' + viewId).classList.add('active');
  const navId = viewId === 'detail' ? 'queue' : viewId;
  const btn = document.querySelector('.nav-btn[data-view="' + navId + '"]');
  if (btn) btn.classList.add('active');
  // Remember the tab so an auto-refresh reload restores it instead of snapping
  // back to Dashboard. sessionStorage survives a reload regardless of whether
  // the meta-refresh keeps the URL hash. Detail is per-climber, so skip it.
  if (viewId !== 'detail') {
    try { sessionStorage.setItem('shiftActiveView', viewId); } catch (e) {}
    try { history.replaceState(null, '', '#' + viewId); }
    catch (e2) { location.hash = viewId; }
  }
  window.scrollTo(0, 0);
  closeMobileNav();
}
function toggleMobileNav() {
  $('sidebar').classList.toggle('open');
  $('sidebar-backdrop').classList.toggle('open');
}
function closeMobileNav() {
  $('sidebar').classList.remove('open');
  $('sidebar-backdrop').classList.remove('open');
}

function safetyBanner() {
  const live = DATA.live_enabled && DATA.mode === 'live';
  if (live) {
    return '<div class="banner banner-warn">' + icon('shield') +
      '<div><strong>LIVE mode.</strong> Eligible climbers below will be tagged in Mailchimp. Sending is handled by the approved Customer Journey.</div></div>';
  }
  return '<div class="banner banner-safe">' + icon('shield') +
    '<div><strong>Dry run — nothing is being sent.</strong> This is a preview of who we’d send a follow-up to. No emails go out, and no one is tagged, until the client clears consent and the Mailchimp Journey is approved.</div></div>';
}

/* ============================ DASHBOARD ============================ */
function renderDashboard() {
  const m = DATA.metrics, s = DATA.summary, dw = DATA.data_window;
  const fn = DATA.funnel || [];
  const convPct = fn.length ? fn[fn.length - 1].pct : 0;
  let h = pageHeader("Here's who to send to today",
    'Behavior pulled from ' + DATA.client + '’s Beta exports. Each priority below is a group we can send to right now; once the survey loop is on, the survey tells us which message fits.');
  h += safetyBanner();

  // behavior-driven priorities (replaces the survey-themes hero)
  const prios = Object.entries(s.by_trigger || {}).filter(([, n]) => n > 0)
    .sort((a, b) => b[1] - a[1]);
  h += '<div class="card card-highlight" style="padding-bottom:4px;"><div class="card-header" style="padding-bottom:6px;">' +
    '<div class="card-title">' + icon('sparkles') + 'Today’s send priorities</div>' +
    '<div class="card-description">The groups in this run’s recovery queue, biggest first. Click through to see exactly who.</div></div>' +
    '<div class="card-content with-top"><div class="prio-grid">';
  if (prios.length === 0) {
    h += '<div class="prio-desc">No groups are eligible for this run. Check back after the next Beta export.</div>';
  }
  prios.forEach(([name, n]) => {
    h += '<div class="prio-card">' +
      '<div class="prio-count"><strong>' + n + '</strong> ' + (n === 1 ? 'climber' : 'climbers') + '</div>' +
      '<div class="prio-title">' + escapeHtml(triggerLabel(name)) + '</div>' +
      '<div class="prio-desc">' + escapeHtml(prioAction(name)) + '</div>' +
      '<button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="setQueueFilter(\'' + name + '\');showView(\'queue\')">View in queue</button>' +
      '</div>';
  });
  h += '</div></div></div>';

  // real headline numbers (no industry benchmarks)
  h += '<div class="stats-grid-3">' +
    statTile('New visitors (last 7 days)', m.new_visitors_7d, 'First check-in within a week') +
    statTile('Didn’t come back', m.one_and_done, 'Bought a trial, no return', true) +
    statTile('Needs follow-up today', m.eligible_now, 'In the recovery queue', m.eligible_now > 0) +
  '</div>';
  h += '<div class="stats-grid-3">' +
    statTile('Trial buyers (all-time)', m.trial_buyers, 'In the Beta export') +
    statTile('Trial → member conversion', convPct + '%', 'Of all trial buyers') +
    statTile('Day-pass regulars', m.daypass_regulars, '2+ day passes in 30 days') +
  '</div>';

  h += '<div class="card"><div class="card-content with-top" style="font-size:12.5px;color:var(--fg-subtle);line-height:1.7;">' +
    'As of <strong>' + escapeHtml(DATA.as_of) + '</strong> &nbsp;·&nbsp; ' +
    'data window: transactions to ' + escapeHtml(dw.transactions_max || '?') + ', check-ins to ' + escapeHtml(dw.sessions_max || '?') + '<br>' +
    'Generated ' + escapeHtml(DATA.generated_at) + ' &nbsp;·&nbsp; mode <strong>' + escapeHtml(DATA.mode) + '</strong>' +
    '</div></div>';

  $('view-dashboard').innerHTML = h;
}

/* ============================ RECOVERY QUEUE ============================ */
let QUEUE_FILTER = 'all';
function queueFilters() {
  const names = [];
  DATA.queue.forEach(q => { if (!names.includes(q.trigger_name)) names.push(q.trigger_name); });
  const out = [{ id: 'all', label: 'All (' + DATA.queue.length + ')' }];
  if (DATA.queue.length > 10) out.push({ id: '__top10', label: 'Top 10 priority' });
  names.forEach(n => out.push({ id: n, label: triggerLabel(n) + ' (' + DATA.queue.filter(q => q.trigger_name === n).length + ')' }));
  return out;
}
function setQueueFilter(id) { QUEUE_FILTER = id; renderQueue(); }
function filteredQueue() {
  if (QUEUE_FILTER === 'all') return DATA.queue;
  if (QUEUE_FILTER === '__top10') return DATA.queue.filter(q => q.priority <= 10);
  return DATA.queue.filter(q => q.trigger_name === QUEUE_FILTER);
}

function reasonLabel(r) {
  return ({ unsubscribed: 'Unsubscribed / cleaned', already_sent: 'Already sent (once only)', cooldown: 'In cooldown', shared_inbox: 'Shared inbox (deduped)' })[r] || r;
}
function withheldCard() {
  const sup = DATA.suppression || {};
  if (!sup.total) return '';
  let h = '<div class="card" style="border-color:var(--warning-soft);">' +
    '<div class="card-header"><div class="card-title">' + icon('shield') + 'Withheld this run (' + sup.total + ')</div>' +
    '<div class="card-description">These matched a trigger but were intentionally not sent, so sender reputation and consent stay protected. Shown for transparency, not queued.</div></div>' +
    '<div class="card-content with-top">';
  h += '<div class="inline-badges" style="margin-bottom:12px;">';
  Object.entries(sup.by_reason || {}).forEach(([r, n]) => {
    h += '<span class="badge badge-warning">' + escapeHtml(reasonLabel(r)) + ': ' + n + '</span>';
  });
  h += '</div>';
  (sup.withheld || []).forEach(w => {
    h += '<div class="withheld-row">' +
      '<span class="withheld-name">' + escapeHtml(w.name || '(no name)') + '</span>' +
      '<span class="badge badge-primary">' + escapeHtml(triggerLabel(w.trigger_name)) + '</span>' +
      '<span class="badge badge-warning">' + escapeHtml(reasonLabel(w.reason)) + '</span>' +
      '<span class="withheld-email">' + escapeHtml(w.email || '') + '</span>' +
      '</div>';
  });
  h += '</div></div>';
  return h;
}

function renderQueue() {
  let h = pageHeader('Recovery Queue',
    'Everyone queued to send to this run, highest priority first. Click a name for their full history. This is who the tool would tag; the Mailchimp Journey sends.');
  h += safetyBanner();
  h += withheldCard();

  const filters = queueFilters();
  if (filters.length > 2) {
    h += '<div class="chips">';
    filters.forEach(f => {
      h += '<button class="chip' + (QUEUE_FILTER === f.id ? ' active' : '') + '" onclick="setQueueFilter(\'' + f.id + '\')">' + escapeHtml(f.label) + '</button>';
    });
    h += '</div>';
  }

  const rows = filteredQueue();
  if (rows.length === 0) {
    h += '<div class="card"><div class="empty-state">' +
      '<div class="empty-state-icon">🎉</div>' +
      '<div class="empty-state-title">No one is waiting</div>' +
      '<div class="empty-state-msg">No climbers match this filter for this run.</div>' +
      '</div></div>';
  }
  rows.forEach(q => { h += renderQueueCard(q); });
  $('view-queue').innerHTML = h;
}

function renderQueueCard(q) {
  return '<div class="card queue-card" id="card-' + escapeHtml(q.climber_id) + '">' +
    '<div class="card-header"><div class="queue-name-row">' +
      '<div class="queue-name" onclick="openDetail(\'' + escapeHtml(q.climber_id) + '\')">' + escapeHtml(q.name || '(no name)') + '</div>' +
      '<div class="inline-badges">' +
        '<span class="badge badge-warning">#' + q.priority + '</span>' +
        '<span class="badge badge-primary">' + escapeHtml(triggerLabel(q.trigger_name)) + '</span>' +
      '</div>' +
    '</div><div class="queue-email">' + escapeHtml(q.email || 'no email on file') + '</div></div>' +
    '<div class="card-content">' +
      '<div class="queue-fields">' +
        field('Trigger', triggerLabel(q.trigger_name)) +
        field('Timing', anchorLabel(q.anchor) + ' + ' + q.days_since + 'd') +
        field('Visits', String(q.visit_count)) +
        field('Template', q.template_id) +
      '</div>' +
      surveyStatusLine(q) +
      '<button class="queue-expand-btn" onclick="toggleExpand(\'' + escapeHtml(q.climber_id) + '\')">▸ Preview the email</button>' +
      '<div class="queue-survey-panel" id="panel-' + escapeHtml(q.climber_id) + '">' +
        '<div class="email-subject">' + escapeHtml(q.subject) + '</div>' +
        '<div class="email-body">' + escapeHtml(q.body_preview) + '</div>' +
      '</div>' +
      '<div class="queue-actions">' +
        '<button class="btn btn-outline btn-sm" onclick="openDetail(\'' + escapeHtml(q.climber_id) + '\')">' + icon('users') + ' Full history</button>' +
        '<button class="btn btn-outline btn-sm" onclick="copyEmail(\'' + escapeHtml(q.climber_id) + '\')">' + icon('copy') + ' Copy email text</button>' +
        '<a class="btn btn-ghost btn-sm" href="mailto:' + encodeURIComponent(q.email) + '">' + icon('mail') + ' Open in mail client</a>' +
      '</div>' +
    '</div></div>';
}

function toggleExpand(id) {
  const p = $('panel-' + id);
  if (p) p.classList.toggle('open');
}

/* ============================ DETAIL ============================ */
function openDetail(id) { renderDetail(id); showView('detail'); }
function renderDetail(id) {
  const q = DATA.queue.find(x => x.climber_id === id);
  if (!q) { $('view-detail').innerHTML = '<div class="card"><div class="empty-state"><div class="empty-state-title">Not found</div></div></div>'; return; }

  let h = '<button class="btn btn-ghost btn-sm" onclick="showView(\'queue\')">‹ Back to queue</button>';
  h += '<div class="page-header" style="margin-top:10px;margin-bottom:14px;">' +
    '<div class="page-title">' + escapeHtml(q.name || '(no name)') + '</div>' +
    '<div class="page-subtitle">' + escapeHtml(q.email || 'no email on file') + '</div></div>';

  h += '<div class="inline-badges" style="margin-bottom:18px;">' +
    '<span class="badge badge-warning">priority #' + q.priority + '</span>' +
    '<span class="badge badge-primary">' + escapeHtml(triggerLabel(q.trigger_name)) + '</span>' +
    '<span class="badge">tag ' + escapeHtml(q.tag) + '</span>' +
    (q.is_member ? '<span class="badge badge-success">member</span>'
      : q.is_converted ? '<span class="badge badge-success">converted</span>'
      : '<span class="badge badge-warning">not a member</span>') +
    '</div>';

  // matched message
  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('sparkles') + 'Matched message</div>' +
    '<div class="card-description">Why this person is in the queue, and the email that is queued for them.</div></div>' +
    '<div class="card-content with-top">' +
    '<div class="queue-fields" style="margin-bottom:10px;">' +
      field('Trigger', triggerLabel(q.trigger_name)) +
      field('Timing', anchorLabel(q.anchor) + ' + ' + q.days_since + 'd') +
      field('Anchor date', q.anchor_date || '—') +
      field('Mailchimp tag', q.tag) +
    '</div>' +
    '<div class="queue-survey-panel open" style="margin-top:0;">' +
      '<div class="email-subject">' + escapeHtml(q.subject) + '</div>' +
      '<div class="email-body">' + escapeHtml(q.body_preview) + '</div>' +
    '</div>' +
    '<div class="queue-actions">' +
      '<button class="btn btn-outline btn-sm" onclick="copyEmail(\'' + escapeHtml(q.climber_id) + '\')">' + icon('copy') + ' Copy email text</button>' +
      '<a class="btn btn-ghost btn-sm" href="mailto:' + encodeURIComponent(q.email) + '">' + icon('mail') + ' Open in mail client</a>' +
    '</div></div></div>';

  // history
  const visits = q.visit_dates || [];
  const daypasses = q.daypass_dates || [];
  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('users') + 'History at ' + escapeHtml(DATA.client) + '</div>' +
    '<div class="card-description">Everything the Beta export knows about this climber.</div></div>' +
    '<div class="card-content with-top">' +
    '<div class="detail-grid">' +
      field('Trial purchased', q.trial_date || '—') +
      field('First check-in', q.first_visit || '—') +
      field('Last check-in', q.last_visit || '—') +
      field('Total visits', String(q.visit_count)) +
      field('Day passes bought', String(daypasses.length)) +
      field('Converted', q.is_converted ? (q.conversion_date || 'yes') : 'no') +
    '</div>';
  if (visits.length) {
    h += '<div style="margin-top:14px;"><div class="field-label" style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--fg-subtle);font-weight:600;">Check-in days (' + visits.length + ')</div>' +
      '<div class="visit-chips">' + visits.map(d => '<span class="visit-chip">' + escapeHtml(d) + '</span>').join('') + '</div></div>';
  }
  if (daypasses.length) {
    h += '<div style="margin-top:12px;"><div class="field-label" style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--fg-subtle);font-weight:600;">Day-pass purchases (' + daypasses.length + ')</div>' +
      '<div class="visit-chips">' + daypasses.map(d => '<span class="visit-chip">' + escapeHtml(d) + '</span>').join('') + '</div></div>';
  }
  h += '</div></div>';

  $('view-detail').innerHTML = h;
}

/* ============================ FUNNEL ============================ */
function renderFunnel() {
  const fn = DATA.funnel || [];
  let h = pageHeader('Trial → member funnel',
    'The conversion story this project is about, told only with real counts from the Beta export. Every trial buyer, and how far each got.');
  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('funnel') + 'Where trial buyers drop off</div>' +
    '<div class="card-description">Each stage is a subset of the one above it, so the bar widths are honest.</div></div>' +
    '<div class="card-content with-top">';
  let prev = null;
  fn.forEach(st => {
    const drop = prev != null && prev > 0 ? Math.round(100 * (prev - st.count) / prev) : null;
    h += '<div class="funnel-row">' +
      '<div class="funnel-top"><div class="funnel-label">' + escapeHtml(st.label) + '</div>' +
        '<div class="funnel-count">' + st.count.toLocaleString() + ' &nbsp;·&nbsp; ' + st.pct + '%' +
        (drop != null && drop > 0 ? ' <span style="color:var(--destructive);">(−' + drop + '%)</span>' : '') + '</div></div>' +
      '<div class="funnel-track"><div class="funnel-fill" style="width:' + Math.max(st.pct, 4) + '%;">' + st.pct + '%</div></div>' +
      '<div class="funnel-note">' + escapeHtml(st.note || '') + '</div>' +
      '</div>';
    prev = st.count;
  });
  h += '</div></div>';

  h += '<div class="card"><div class="card-content with-top" style="font-size:12.5px;color:var(--fg-subtle);line-height:1.7;">' +
    'Counts are distinct climbers, joined transactions ↔ check-ins on climber id. "Became a member" = bought a recurring/prepaid plan or appears in the Memberships export. ' +
    'As of <strong>' + escapeHtml(DATA.as_of) + '</strong>.' +
    '</div></div>';
  $('view-funnel').innerHTML = h;
}

/* ============================ SETTINGS ============================ */
function renderSettings() {
  const c = DATA.config;
  let h = pageHeader('Configuration',
    'Everything here lives in this client’s client.json. Change timing, who qualifies, or the message catalog without touching code.');

  // client + data
  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('settings') + 'Client & data sources</div></div>' +
    '<div class="card-content with-top">' +
    cfgRow('Client', c.client_name + ' (' + c.slug + ')') +
    cfgRow('Transactions', c.data_sources.transactions_csv) +
    cfgRow('Check-ins', c.data_sources.sessions_csv) +
    cfgRow('Memberships', c.data_sources.memberships_csv) +
    cfgRow('Data window', 'transactions to ' + (DATA.data_window.transactions_max || '?') + ', check-ins to ' + (DATA.data_window.sessions_max || '?')) +
    '</div></div>';

  // product tiers
  const t = c.tiers;
  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('users') + 'Product tiers</div>' +
    '<div class="card-description">How this gym’s POS products map to commitment. Edit per client.</div></div>' +
    '<div class="card-content with-top">' +
    cfgRow('Trial', skuBadges(t.trial_skus)) +
    cfgRow('Low commitment', skuBadges(t.low_commitment_skus)) +
    cfgRow('Conversion', skuBadges(t.conversion_skus)) +
    cfgRow('Day-pass regular', t.daypass_repeat.min_count + '+ day passes in ' + t.daypass_repeat.window_days + ' days') +
    '</div></div>';

  // trigger catalog
  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('sparkles') + 'Message catalog</div>' +
    '<div class="card-description">' + c.triggers.length + ' triggers, in precedence order (top wins; one message per person per run). Survey-anchored triggers light up once the survey loop is on.</div></div>' +
    '<div class="card-content with-top">';
  c.triggers.forEach(tr => {
    const waiting = tr.anchor === 'survey_sent';
    const reqStr = Object.keys(tr.requires || {}).length
      ? Object.entries(tr.requires).map(([k, v]) => k + '=' + v).join(', ') : 'none';
    h += '<div class="cfg-trigger' + (waiting ? ' cfg-waiting' : '') + '">' +
      '<div class="cfg-trigger-head">' +
        '<span class="cfg-trigger-name">' + escapeHtml(triggerLabel(tr.name)) + '</span>' +
        '<span class="badge badge-primary">' + escapeHtml(tr.tag) + '</span>' +
        (tr.active ? '' : '<span class="badge">inactive</span>') +
        (waiting ? '<span class="badge badge-warning">needs survey loop</span>' : '') +
      '</div>' +
      '<div class="cfg-trigger-meta">' +
        escapeHtml(tr.description || '') + '<br>' +
        'anchor <strong>' + escapeHtml(tr.anchor) + '</strong> · window day ' + tr.window_days[0] + '–' + tr.window_days[1] +
        ' · requires ' + escapeHtml(reqStr) +
        ' · ' + (tr.once_only ? 'once only' : (tr.cooldown_days ? tr.cooldown_days + 'd cooldown' : 'repeatable')) +
        ' · template ' + escapeHtml(tr.template_id) +
      '</div></div>';
  });
  h += '</div></div>';

  // safety
  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('shield') + 'Safety locks</div></div>' +
    '<div class="card-content with-top">' +
    '<div style="margin-bottom:10px;">Live sending is <strong>' + (c.safety.live_enabled ? 'ENABLED' : 'OFF') + '</strong> for this client. ' +
    'The tool only ever applies a Mailchimp tag; a Customer Journey does the sending, and only after the client approves it.</div>' +
    '<ul style="margin:0 0 0 18px;font-size:12.5px;color:var(--fg-muted);line-height:1.7;">' +
    c.safety.locks.map(l => '<li>' + escapeHtml(l) + '</li>').join('') +
    '</ul></div></div>';

  $('view-settings').innerHTML = h;
}
function cfgRow(k, v) {
  return '<div class="cfg-row"><div class="cfg-key">' + escapeHtml(k) + '</div><div class="cfg-val">' + v + '</div></div>';
}
function skuBadges(arr) {
  return '<div class="inline-badges">' + (arr || []).map(s => '<span class="badge">' + escapeHtml(s) + '</span>').join('') + '</div>';
}

/* ============================ INBOX (survey responses) ============================ */
let SELECTED_RESPONSE = 0;
function selectResponse(i) { SELECTED_RESPONSE = i; renderInbox(); }
function renderInbox() {
  const sv = DATA.survey || {};
  const responses = sv.responses || [];
  let h = pageHeader('Survey inbox',
    'First-visit survey responses for ' + DATA.client + '. The answer tells us why, so the next message can be matched to the real blocker. Non-responders stay in the recovery queue.');
  if (!responses.length) {
    h += '<div class="card"><div class="empty-state">' +
      '<div class="empty-state-icon">📭</div>' +
      '<div class="empty-state-title">No survey responses yet</div>' +
      '<div class="empty-state-msg">Responses show up here as first-timers fill out the survey.</div>' +
      '</div></div>';
    $('view-inbox').innerHTML = h; return;
  }
  if (SELECTED_RESPONSE >= responses.length) SELECTED_RESPONSE = 0;
  h += '<div class="inbox-layout"><div class="inbox-list">';
  responses.forEach((r, i) => {
    const who = r.name || r.email || '(no email)';
    h += '<button class="inbox-item' + (i === SELECTED_RESPONSE ? ' active' : '') + '" onclick="selectResponse(' + i + ')">' +
      '<div class="inbox-item-name">' + escapeHtml(who) + '</div>' +
      '<div class="inbox-item-meta">' +
        (r.answered_at ? '<span>' + escapeHtml(r.answered_at) + '</span>' : '') +
        (r.safety ? '<span class="badge badge-destructive">⚠ safety</span>'
          : r.blocker ? '<span class="badge badge-warning">' + escapeHtml(blockerLabel(r.blocker)) + '</span>' : '') +
        (r.matched ? '' : '<span class="badge">unmatched</span>') +
      '</div></button>';
  });
  h += '</div><div>' + inboxDetail(responses[SELECTED_RESPONSE]) + '</div></div>';
  $('view-inbox').innerHTML = h;
}
function inboxDetail(r) {
  if (!r) return '';
  const matchedItem = r.matched ? DATA.queue.find(q => q.climber_id === r.climber_id) : null;
  let h = '<div class="card"><div class="card-header"><div class="card-title">' + icon('mail') + escapeHtml(r.name || r.email || '(no email)') + '</div>' +
    '<div class="card-description">' + escapeHtml(r.email || '') + (r.answered_at ? ' · ' + escapeHtml(r.answered_at) : '') + '</div></div>' +
    '<div class="card-content with-top">';
  h += '<div class="inline-badges" style="margin-bottom:14px;">' +
    (r.safety ? '<span class="badge badge-destructive">⚠ safety concern</span>' : '') +
    (r.matched ? '<span class="badge badge-success">matched a climber</span>' : '<span class="badge badge-warning">no climber match</span>') +
    (r.blocker ? '<span class="badge badge-warning">' + escapeHtml(blockerLabel(r.blocker)) + '</span>' : '') +
    (r.intent ? '<span class="badge badge-info">' + escapeHtml(intentLabel(r.intent)) + '</span>' : '') +
    '</div>';
  h += inboxQ('Overall first visit', r.q1_overall);
  h += inboxQ('Likely to become a regular?', r.q2_intent);
  h += inboxQ('Main issue, if any', r.q3_blocker_raw);
  h += inboxQ('Anything else', r.q4_text);
  if (matchedItem) {
    h += '<div class="queue-actions"><button class="btn btn-outline btn-sm" onclick="openDetail(\'' + escapeHtml(matchedItem.climber_id) + '\')">' + icon('users') + ' Open in recovery queue</button></div>';
  } else if (!r.matched) {
    h += '<div style="font-size:12px;color:var(--fg-subtle);margin-top:8px;line-height:1.6;">No climber in the Beta export matches this email (typo, or a contact we have not imported). Kept here for manual review, never dropped.</div>';
  }
  h += '</div></div>';
  return h;
}
function inboxQ(label, ans) {
  const empty = !ans || !String(ans).trim();
  return '<div class="inbox-q"><div class="q-label">' + escapeHtml(label) + '</div>' +
    '<div class="q-ans' + (empty ? ' muted' : '') + '">' + (empty ? '(no answer)' : escapeHtml(ans)) + '</div></div>';
}

/* ============================ INSIGHTS (survey) ============================ */
function bar(label, n, max) {
  const pct = max > 0 ? Math.round(100 * n / max) : 0;
  return '<div class="bar-row"><div class="bar-top"><div class="bar-label">' + escapeHtml(label) + '</div>' +
    '<div class="bar-count">' + n + '</div></div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:' + Math.max(pct, 2) + '%;"></div></div></div>';
}
function renderInsights() {
  const sv = DATA.survey || {};
  const responses = sv.responses || [];
  let h = pageHeader('Survey insights',
    'What the first-visit survey is telling us about ' + DATA.client + '. The same answers feed the deeper analysis.');
  if (!responses.length) {
    h += '<div class="card"><div class="empty-state">' +
      '<div class="empty-state-icon">📊</div>' +
      '<div class="empty-state-title">No survey data yet</div>' +
      '<div class="empty-state-msg">Insights populate once survey responses come in.</div>' +
      '</div></div>';
    $('view-insights').innerHTML = h; return;
  }
  const matched = sv.matched || 0, unmatched = sv.unmatched || 0, safety = sv.safety || 0;
  h += '<div class="stats-grid-3">' +
    statTile('Responses', responses.length, 'First-visit surveys in') +
    statTile('Matched to a climber', matched, 'Drive a matched follow-up') +
    statTile('Safety flags', safety, 'Manager call, no auto-email', safety > 0) +
  '</div>';

  const byBlocker = sv.by_blocker || {};
  const blockerEntries = Object.entries(byBlocker).sort((a, b) => b[1] - a[1]);
  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('sparkles') + 'Why first-timers hesitate</div>' +
    '<div class="card-description">The blocker each respondent named (Q3). This is what each recovery message answers.</div></div>' +
    '<div class="card-content with-top">';
  if (!blockerEntries.length) {
    h += '<div style="color:var(--fg-subtle);font-size:12.5px;">No blockers reported yet.</div>';
  } else {
    const maxB = Math.max.apply(null, blockerEntries.map(e => e[1]));
    blockerEntries.forEach(([b, n]) => { h += bar(blockerLabel(b), n, maxB); });
  }
  h += '</div></div>';

  const intents = { high: 0, medium: 0, low: 0 };
  responses.forEach(r => { if (r.intent && intents[r.intent] != null) intents[r.intent]++; });
  const intentTotal = intents.high + intents.medium + intents.low;
  h += '<div class="card"><div class="card-header"><div class="card-title">' + icon('funnel') + 'How likely to become regulars</div>' +
    '<div class="card-description">Self-reported intent (Q2). High-intent first-timers get the round-two invite.</div></div>' +
    '<div class="card-content with-top">';
  if (!intentTotal) {
    h += '<div style="color:var(--fg-subtle);font-size:12.5px;">No intent answers yet.</div>';
  } else {
    const maxI = Math.max(intents.high, intents.medium, intents.low);
    ['high', 'medium', 'low'].forEach(k => { if (intents[k]) h += bar(intentLabel(k), intents[k], maxI); });
  }
  h += '</div></div>';

  if (unmatched) {
    h += '<div class="card"><div class="card-content with-top" style="font-size:12.5px;color:var(--fg-subtle);line-height:1.7;">' +
      unmatched + ' response' + (unmatched === 1 ? '' : 's') + ' did not match a climber in the Beta export. Kept in the Inbox for manual review, never dropped.' +
      '</div></div>';
  }
  $('view-insights').innerHTML = h;
}

function setupSurveyNav() {
  const inbox = $('nav-inbox'), insights = $('nav-insights');
  const label = $('survey-nav-label'), badge = $('inbox-badge');
  if (surveyOn()) {
    label.textContent = 'Survey loop';
    inbox.onclick = () => showView('inbox');
    insights.onclick = () => showView('insights');
    const n = (DATA.survey.responses || []).length;
    if (n) { badge.textContent = n; badge.style.display = ''; }
    renderInbox();
    renderInsights();
  } else {
    label.textContent = 'Coming with the survey loop';
    [inbox, insights].forEach(b => { b.style.opacity = '0.5'; b.style.cursor = 'not-allowed'; });
    inbox.onclick = () => toast('Inbox activates when the survey loop is on');
    insights.onclick = () => toast('Insights activates when the survey loop is on');
  }
}

/* ============================ shared actions ============================ */
function copyEmail(id) {
  const q = DATA.queue.find(x => x.climber_id === id);
  if (!q) return;
  const text = 'To: ' + q.email + '\nSubject: ' + q.subject + '\n\n' + q.body_preview;
  navigator.clipboard.writeText(text).then(() => toast('Email text copied to clipboard'),
                                          () => toast('Copy failed - select manually'));
}
function toast(msg) {
  const host = $('toast-host');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// init
$('brand-sub').textContent = DATA.client || 'Send It';
$('queue-badge').textContent = DATA.queue.length;
$('footer-meta').textContent = 'as of ' + DATA.as_of + ' · ' + DATA.mode;
renderDashboard();
renderQueue();
renderFunnel();
renderSettings();
setupSurveyNav();

// Restore the tab across auto-refresh reloads (so a periodic refresh doesn't
// snap the reader back to Dashboard). Inbox/Insights only when the survey is on.
(function restoreView() {
  let id = '';
  try { id = sessionStorage.getItem('shiftActiveView') || ''; } catch (e) {}
  if (!id) id = (location.hash || '').replace('#', '');
  const valid = ['dashboard', 'queue', 'funnel', 'settings', 'inbox', 'insights'];
  if (!valid.includes(id) || id === 'dashboard') return;
  if ((id === 'inbox' || id === 'insights') && !surveyOn()) return;
  showView(id);
})();
</script>
</body>
</html>
