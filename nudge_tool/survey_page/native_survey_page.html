<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="survey-support-email" content="__SURVEY_SUPPORT_EMAIL__">
<title>Your first visit · Send It</title><link rel="stylesheet" href="/survey.css"><script src="/survey.js" defer></script></head>
<body><main>
<header><span class="brand">SEND IT<span class="dot">●</span></span></header>
<p class="eyebrow">Your answers help make the next visit better.</p>
<div class="progress"><span id="progress-label">Your first visit</span><progress id="progress" max="4" value="0" aria-label="Survey progress"></progress></div>
<section id="question" aria-labelledby="heading"><h1 id="heading" tabindex="-1">Getting your survey…</h1></section>
<p id="save-state" role="status" aria-live="polite"></p>
<p id="error" role="alert" hidden></p>
<div id="recovery"><button id="retry" type="button" hidden>Retry save</button><button id="reload" type="button" hidden>Load saved answers</button></div>
<nav aria-label="Survey navigation"><button id="back" type="button" hidden>← Back</button><button id="next" type="button" hidden>Continue</button><button id="finish" type="button" hidden>Finish survey</button></nav>
<noscript>This survey needs JavaScript to save answers.</noscript>
</main></body></html>
