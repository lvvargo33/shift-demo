<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="survey-support-email" content="__SURVEY_SUPPORT_EMAIL__">
<title>Member survey · Appalachian Bouldering Center</title><link rel="stylesheet" href="/member-survey.css"><script src="/member-survey.js" defer></script></head>
<body><main><header><span class="brand">APPALACHIAN BOULDERING CENTER</span></header>
<p class="eyebrow">Your feedback helps us make ABC better.</p>
<div class="progress"><span id="progress-label">Member survey</span><progress id="progress" max="6" value="0" aria-label="Survey progress"></progress></div>
<section id="page" aria-labelledby="page-title"><h1 id="page-title" tabindex="-1">Getting your survey…</h1></section>
<p id="save-state" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p>
<div id="recovery"><button id="retry" type="button" hidden>Retry save</button><button id="reload" type="button" hidden>Load saved answers</button></div>
<nav aria-label="Survey navigation"><button id="back" type="button" hidden>← Back</button><button id="continue" type="button" hidden>Continue</button><button id="finish" type="button" hidden>Finish</button></nav>
<noscript>This survey needs JavaScript to save answers.</noscript></main></body></html>
